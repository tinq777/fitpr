  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="FitPR"/>
  <meta name="description" content="FitPR — minimal fitness tracker with personal record tracking."/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <title>FitPR</title>
  <script>
    // Favicon — injected as blob URL for cross-browser reliability
    (function(){
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
        <rect width="64" height="64" rx="12" fill="#c8f542"/>
        <path d="M20 16v32M44 16v32M10 24h10M44 24h10M10 40h10M44 40h10M20 32h24"
          stroke="#0a0a0c" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>`;
      const blob = new Blob([svg], {type:"image/svg+xml"});
      const url  = URL.createObjectURL(blob);
      const link = document.createElement("link");
      link.rel  = "icon";
      link.type = "image/svg+xml";
      link.href = url;
      document.head.appendChild(link);

      // Apple touch icon (PNG canvas fallback for iOS)
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = 180;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, 180, 180);
        const apple = document.createElement("link");
        apple.rel  = "apple-touch-icon";
        apple.href = canvas.toDataURL("image/png");
        document.head.appendChild(apple);
        URL.revokeObjectURL(url);
      };
      img.src = url;
    })();

    // PWA Manifest
    (function(){
      const manifest = {
        name:"FitPR", short_name:"FitPR", description:"Minimal fitness & PR tracker",
        start_url:".", display:"standalone", background_color:"#0a0a0c", theme_color:"#0a0a0c",
        icons:[{
          src:"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23c8f542'/%3E%3Cpath d='M20 16v32M44 16v32M10 24h10M44 24h10M10 40h10M44 40h10M20 32h24' stroke='%230a0a0c' stroke-width='6' stroke-linecap='round' fill='none'/%3E%3C/svg%3E",
          sizes:"any", type:"image/svg+xml"
        }]
      };
      const b = new Blob([JSON.stringify(manifest)], {type:"application/json"});
      const link = document.createElement("link");
      link.rel  = "manifest";
      link.href = URL.createObjectURL(b);
      document.head.appendChild(link);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{font-size:14px;-webkit-text-size-adjust:100%}
    body{font-family:'DM Mono','Courier New',monospace;background:#0a0a0c;color:#f0f0f5;min-height:100dvh;overscroll-behavior:none}
    /* Prevent iOS auto-zoom on input focus — must be font-size >= 16px */
    input,select,textarea{font-size:16px!important;font-family:inherit}
    input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
    input[type=number]{-moz-appearance:textfield}
    ::-webkit-scrollbar{display:none}
    button{font-family:inherit;cursor:pointer;touch-action:manipulation}
    /* Prevent long-press text selection on drag handles and cards */
    [data-drag-handle]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    .ex-card{-webkit-touch-callout:none}
    #install-banner{display:none;position:fixed;bottom:0;left:0;right:0;z-index:2000;background:#111114;border-top:1px solid #1e1e26;padding:14px 18px 28px;align-items:center;gap:12px}
    #install-banner.show{display:flex}
    .backdrop{position:fixed;inset:0;z-index:1000;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
    .modal{background:#111114;border:1px solid #1e1e26;border-radius:14px;padding:24px 22px;width:100%;max-width:360px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
    /* Picker full-screen on mobile */
    .picker-sheet{background:#111114;border-radius:16px 16px 0 0;width:100%;max-width:480px;display:flex;flex-direction:column;animation:slide-up .25s cubic-bezier(.25,.46,.45,.94) both;max-height:92dvh}
    #toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(16px);background:#2ecc71;color:#0a0a0c;font-weight:800;font-size:14px;font-family:'DM Mono',monospace;padding:8px 18px;border-radius:20px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap;z-index:3000}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .tabs{display:flex;gap:3px;overflow-x:auto;scrollbar-width:none}
    .tabs::-webkit-scrollbar{display:none}
    @media(max-width:480px){
      .modal{border-radius:16px 16px 0 0;max-width:100%;margin:0;position:fixed;bottom:0;left:0;right:0;max-height:92dvh;overflow-y:auto}
      .backdrop{align-items:flex-end;padding:0}
    }
  </style>
</head>

const save  = d => { try { localStorage.setItem(STORE,JSON.stringify(d)); } catch(e){} };

const fmtDate = ts => {
  const d = new Date(ts);
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
};
const ago = ts => {
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1) return "just now";
  if(m<60) return m+"m ago";
  const h=Math.floor(m/60);
  if(h<24) return h+"h ago";
  return Math.floor(h/24)+"d ago";
};
const toast = msg => {
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),2400);
};

// ─── Default factories ────────────────────────────────────────────────────────
const mkSet  = (reps=10,load=0) => ({id:uid(),reps,load,done:false});
const mkEx   = (name="")        => ({id:uid(),name,sets:[mkSet()],prevSets:[]});
const mkWork = n => ({
  id:uid(), title:`Workout ${n}`, sessions:[],
  sections:{ warmup:[mkEx("Jumping Jacks")], exercises:[mkEx("Bench Press"),mkEx("Squat")], cooldown:[mkEx("Stretching")] }
});
const initState = () => {
  const s = load();
  if(s && s.workouts && s.workouts.length) return s;
  return { workouts:[mkWork(1)], tab:"stats", prs:{}, weeklyGoal:4, onboarded:false };
};

// ─── PR helpers ───────────────────────────────────────────────────────────────
const detectPRs = (sections, oldPRs) => {
  const prs = {...oldPRs};
  const hits = [];
  for(const exs of Object.values(sections)){
    for(const ex of exs){
      if(!ex.name.trim()) continue;
      const n = ex.name.trim();
      const p = prs[n] || {bestLoad:0,bestReps:0,bestVol:0,date:null};
      let changed=false;
      for(const s of ex.sets){
        const load=parseFloat(s.load)||0, reps=parseInt(s.reps)||0, vol=load*reps;
        if(load>p.bestLoad){ p.bestLoad=load; changed=true; }
        if(reps>p.bestReps){ p.bestReps=reps; changed=true; }
        if(vol >p.bestVol ){ p.bestVol =vol;  changed=true; }
      }
      if(changed){ p.date=Date.now(); prs[n]=p; hits.push(n); }
    }
  }
  return {prs,hits};
};

  const bs={background:C.surH,border:`1px solid ${C.bdr}`,borderRadius:5,color:C.mut,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .12s",padding:0,fontSize:15,fontWeight:700};
  const saveEdit=()=>{
    const n=parseFloat(draft);
    if(!isNaN(n)) onChange(Math.max(min,parseFloat(n.toFixed(2))));
    setEditing(false);
  };
  if(editing){
    return (
      <div style={{display:"flex",alignItems:"center",gap:4}}>
        <input type="number" value={draft} onChange={e=>setDraft(e.target.value)}
          onBlur={saveEdit} onKeyDown={e=>e.key==="Enter"&&saveEdit()}

          style={{width:64,background:C.sur,border:`1px solid ${C.acc}`,borderRadius:6,color:C.txt,padding:"4px 8px",outline:"none",fontFamily:"inherit",textAlign:"center",fontSize:15}}/>

      </div>
    );
  }
  return (
    <div style={{display:"flex",alignItems:"center",gap:4}}>
      <button style={bs}
        onMouseEnter={e=>{e.currentTarget.style.borderColor=C.acc;e.currentTarget.style.color=C.acc}}
        onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bdr;e.currentTarget.style.color=C.mut}}
        onClick={()=>onChange(Math.max(min,parseFloat((v-step).toFixed(2))))}>−</button>

        style={{textAlign:"center",minWidth:38,fontSize:13,fontWeight:700,color:C.txt,cursor:"text",userSelect:"none",padding:"2px 0"}}>

const ExerciseTimer = ({duration, onChangeDuration}) => {
  const [running, setRunning]   = useState(false);
  const [remaining, setRemaining] = useState(duration);
  const [editing, setEditing]   = useState(false);
  const [draftSecs, setDraftSecs] = useState(duration);
  const intervalRef = useRef(null);
  const beepRef     = useRef(null);

  // keep remaining in sync when duration changes externally
  useEffect(()=>{ if(!running) setRemaining(duration); }, [duration]);

  // countdown tick
  useEffect(()=>{
    if(running){
      intervalRef.current = setInterval(()=>{
        setRemaining(r=>{
          if(r<=1){
            clearInterval(intervalRef.current);
            setRunning(false);
            // vibrate
            if(navigator.vibrate) navigator.vibrate([200,100,200]);
            // beep via Web Audio
            try {
              const ctx = new (window.AudioContext||window.webkitAudioContext)();
              [0,0.3,0.6].forEach(offset=>{
                const osc=ctx.createOscillator();
                const gain=ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.frequency.value=880;
                gain.gain.setValueAtTime(0.4,ctx.currentTime+offset);
                gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+offset+0.25);
                osc.start(ctx.currentTime+offset);
                osc.stop(ctx.currentTime+offset+0.25);
              });
            } catch(e){}
            return 0;
          }
          return r-1;
        });
      },1000);
    } else {
      clearInterval(intervalRef.current);
    }
    return ()=>clearInterval(intervalRef.current);
  },[running]);

  const toggle = () => {
    if(remaining===0){ setRemaining(duration); setTimeout(()=>setRunning(true),50); return; }
    setRunning(r=>!r);
  };
  const reset = () => { setRunning(false); setRemaining(duration); };

  const pct = duration>0 ? remaining/duration : 0;
  const mins = Math.floor(remaining/60);
  const secs = remaining%60;
  const timeStr = mins>0 ? `${mins}:${String(secs).padStart(2,"0")}` : `${secs}s`;
  const done = remaining===0;
  const ringColor = done ? C.grn : running ? C.acc : C.mut;
  const size=52, stroke=4, r=(size-stroke)/2, circ=2*Math.PI*r;

  const saveEdit = () => {
    const v = Math.max(1, Math.min(3600, parseInt(draftSecs)||30));
    onChangeDuration(v);
    setRemaining(v);
    setRunning(false);
    setEditing(false);
  };

  return (
    <div style={{background:done?C.grnF:running?C.accF:C.bg, border:`1px solid ${done?C.grn+"55":running?C.acc+"44":C.bdr}`, borderRadius:10, padding:"10px 12px", marginBottom:8, display:"flex", alignItems:"center", gap:12, transition:"all .3s"}}>
      {/* Ring */}
      <div style={{cursor:"pointer",position:"relative",width:size,height:size,flexShrink:0}} onClick={toggle}>
        <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.bdr} strokeWidth={stroke}/>
          <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={ringColor} strokeWidth={stroke}
            strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round"
            style={{transition:running?"stroke-dashoffset 1s linear":"stroke-dashoffset .3s ease"}}/>
        </svg>
        <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column"}}>
          <span style={{fontSize:done?16:11,fontWeight:800,color:ringColor,lineHeight:1}}>{done?"✓":timeStr}</span>
        </div>
      </div>

      {/* Controls */}
      <div style={{flex:1}}>
        <div style={{fontSize:10,color:C.mut,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>
          {done?"Complete!":running?"Running…":"Timer"}
        </div>
        {editing ? (
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <input type="number" value={draftSecs} onChange={e=>setDraftSecs(e.target.value)}
              onBlur={saveEdit} onKeyDown={e=>e.key==="Enter"&&saveEdit()}
              style={{width:64,background:C.sur,border:`1px solid ${C.acc}`,borderRadius:6,color:C.txt,padding:"4px 8px",outline:"none",fontFamily:"inherit",textAlign:"center"}}
              autoFocus/>
            <span style={{fontSize:11,color:C.mut}}>seconds</span>
            <button onClick={saveEdit} style={{background:C.acc,border:"none",borderRadius:6,color:"#0a0a0c",fontSize:11,fontWeight:800,padding:"4px 10px",fontFamily:"inherit"}}>Set</button>
          </div>
        ) : (
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <button onClick={toggle}
              style={{background:done?C.grn:running?C.red:C.acc,border:"none",borderRadius:7,color:"#0a0a0c",fontSize:11,fontWeight:800,padding:"5px 12px",fontFamily:"inherit",transition:"background .2s"}}>
              {done?"Restart":running?"Stop":"Start"}
            </button>
            {(running||done)&&(
              <button onClick={reset}
                style={{background:"none",border:`1px solid ${C.bdr}`,borderRadius:7,color:C.mut,fontSize:11,fontWeight:700,padding:"5px 10px",fontFamily:"inherit",transition:"all .15s"}}>
                Reset
              </button>
            )}
            {!running&&!done&&(
              <button onClick={()=>{setEditing(true);setDraftSecs(duration);}}
                style={{background:"none",border:`1px solid ${C.bdr}`,borderRadius:7,color:C.mut,fontSize:11,padding:"5px 8px",display:"flex",alignItems:"center",gap:4,fontFamily:"inherit"}}>
                <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                {duration}s
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

  const delSet=i=>onChange({...exercise,sets:exercise.sets.filter((_,j)=>j!==i)});
  const addSet=()=>{
    const last=exercise.sets[exercise.sets.length-1]||{reps:10,load:0};
    onChange({...exercise,sets:[...exercise.sets,mkSet(last.reps,last.load)]});
  };
  // Timer is visible whenever timerDuration is set — persists across sessions
  const timerOn = !!(exercise.timerDuration);
  const toggleTimer=()=>{
    if(timerOn){
      // remove timer entirely
      const {timerDuration:_,...rest}=exercise;
      onChange(rest);

      // add timer with default 30s
      onChange({...exercise,timerDuration:30});

  const prev=exercise.prevSets||[];

  const isPR=s=>{
    if(!exPR) return false;
    const l=parseFloat(s.load)||0,r=parseInt(s.reps)||0;

// ─── Drag-to-reorder hook (floating card) ────────────────────────────────────
const useDragSort = (items, onReorder) => {
  const [dragIdx,  setDragIdx]  = useState(null);
  const [overIdx,  setOverIdx]  = useState(null);
  const [floatY,   setFloatY]   = useState(0);
  const [cardH,    setCardH]    = useState(80);
  const listRef  = useRef(null);
  const itemEls  = useRef([]);
  const st       = useRef({ dragIdx:null, overIdx:null, startClientY:0, elOffsetInList:0, cardH:80 });

  const setRef = (idx, el) => { itemEls.current[idx] = el; };

  const onDragStart = (idx, e) => {
    e.preventDefault(); e.stopPropagation();
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    const el = itemEls.current[idx];
    const listRect = listRef.current ? listRef.current.getBoundingClientRect() : {top:0};
    const elRect   = el ? el.getBoundingClientRect() : {height:80, top:0};
    const h = elRect.height + 8;
    st.current = { dragIdx:idx, overIdx:idx, startClientY:clientY, elOffsetInList:elRect.top - listRect.top, cardH:h };
    setCardH(h); setDragIdx(idx); setOverIdx(idx); setFloatY(elRect.top - listRect.top);
    document.body.style.overflow = "hidden";
    document.body.style.userSelect = "none";
    document.body.style.webkitUserSelect = "none";
    document.documentElement.style.webkitUserSelect = "none";
  };

  useEffect(() => {
    const onMove = e => {
      if (st.current.dragIdx === null) return;
      if (e.cancelable) e.preventDefault();
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const dy = clientY - st.current.startClientY;
      const newFloatY = Math.max(0, Math.min((items.length - 1) * st.current.cardH, st.current.elOffsetInList + dy));
      setFloatY(newFloatY);
      const newOver = Math.max(0, Math.min(items.length - 1, Math.round(newFloatY / st.current.cardH)));
      if (newOver !== st.current.overIdx) { st.current.overIdx = newOver; setOverIdx(newOver); }
    };
    const onEnd = () => {
      if (st.current.dragIdx === null) return;
      const { dragIdx, overIdx } = st.current;
      st.current.dragIdx = null; st.current.overIdx = null;
      setDragIdx(null); setOverIdx(null);
      document.body.style.overflow = "";
      document.body.style.userSelect = "";
      document.body.style.webkitUserSelect = "";
      document.documentElement.style.webkitUserSelect = "";
      if (dragIdx !== overIdx) {
        const next = [...items];
        const [moved] = next.splice(dragIdx, 1);
        next.splice(overIdx, 0, moved);
        onReorder(next);
      }
    };
    window.addEventListener("touchmove",  onMove, {passive:false});
    window.addEventListener("touchend",   onEnd);
    window.addEventListener("mousemove",  onMove);
    window.addEventListener("mouseup",    onEnd);
    return () => {
      window.removeEventListener("touchmove",  onMove);
      window.removeEventListener("touchend",   onEnd);
      window.removeEventListener("mousemove",  onMove);
      window.removeEventListener("mouseup",    onEnd);
    };
  }, [items]);

  const getShift = (idx) => {
    if (dragIdx === null || idx === dragIdx) return 0;
    const d = dragIdx, o = overIdx;
    if (d < o && idx > d && idx <= o) return -cardH;
    if (d > o && idx >= o && idx < d) return  cardH;
    return 0;
  };

  const handleProps = (idx) => ({
    onMouseDown:  e => onDragStart(idx, e),
    onTouchStart: e => onDragStart(idx, e),
    style: {
      cursor: dragIdx !== null ? "grabbing" : "grab",
      touchAction:"none", userSelect:"none",
      WebkitUserSelect:"none", WebkitTouchCallout:"none",
      color:C.dim, padding:"4px 6px",
      display:"flex", alignItems:"center", flexShrink:0,
    },
    onMouseEnter: e => { if(dragIdx===null) e.currentTarget.style.color=C.mut; },
    onMouseLeave: e => { if(dragIdx===null) e.currentTarget.style.color=C.dim; },
  });

  return { listRef, setRef, handleProps, dragIdx, overIdx, floatY, cardH, getShift };
};

// ─── Section ──────────────────────────────────────────────────────────────────
const Section = ({label,icon,color,exercises,onChange,onAdd,onLib,onDel,prs}) => {
  const [collapsed,setCollapsed]=useState(false);
  const total=exercises.length;
  const done=exercises.flatMap(e=>e.sets).filter(s=>s.done).length;
  const totalSets=exercises.flatMap(e=>e.sets).length;
  const {listRef,setRef,handleProps,dragIdx,overIdx,floatY,cardH,getShift}=useDragSort(exercises, onChange);
  return (
    <div style={{marginBottom:16}}>
      <button onClick={()=>setCollapsed(!collapsed)}
        style={{width:"100%",background:"none",border:"none",padding:0,display:"flex",alignItems:"center",gap:8,marginBottom:collapsed?0:12,cursor:"pointer"}}>
        <span style={{color}}>{icon}</span>
        <span style={{color,fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:2}}>{label}</span>
        {total>0&&<span style={{fontSize:9,color:C.mut,fontWeight:700}}>{total} exercise{total!==1?"s":""}</span>}
        <div style={{flex:1,height:1,background:`${color}22`}}/>
        {totalSets>0&&<span style={{fontSize:9,color:done===totalSets&&totalSets>0?C.grn:C.mut,fontWeight:700}}>{done}/{totalSets}</span>}
        <span style={{color:C.dim,fontSize:11,marginLeft:2}}>{collapsed?"▾":"▴"}</span>
      </button>
      {!collapsed&&(
        <>
          {/* List container — position:relative so floating card stays inside */}
          <div ref={listRef} style={{position:"relative", minHeight: dragIdx!==null ? exercises.length*cardH : undefined}}>
            {exercises.map((ex,idx)=>(
              <div key={ex.id} ref={el=>setRef(idx,el)}
                style={{
                  transform: dragIdx===null ? "none" : idx===dragIdx ? `translateY(${floatY - idx*cardH}px)` : `translateY(${getShift(idx)}px)`,
                  transition: idx===dragIdx ? "none" : "transform .2s cubic-bezier(.25,.46,.45,.94)",
                  zIndex: idx===dragIdx ? 100 : 1,
                  position: "relative",
                  opacity: 1,
                  boxShadow: idx===dragIdx ? "0 8px 32px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3)" : "none",
                  borderRadius: idx===dragIdx ? 10 : undefined,
                  scale: idx===dragIdx ? "1.03" : "1",
                }}>
                <ExCard exercise={ex} prs={prs}
                  dragHandleProps={handleProps(idx)}
                  onChange={u=>onChange(exercises.map(e=>e.id===ex.id?u:e))}
                  onDelete={()=>onDel(ex.id)}/>
              </div>
            ))}
            {/* Drop target indicator */}
            {dragIdx!==null&&overIdx!==null&&overIdx!==dragIdx&&(
              <div style={{
                position:"absolute", left:0, right:0,
                top: overIdx*cardH - 2,
                height:3, borderRadius:2,
                background: color, opacity:0.8,
                pointerEvents:"none",
                boxShadow:`0 0 8px ${color}`,
                transition:"top .15s ease",
              }}/>
            )}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:8}}>
            <button onClick={onLib}
              style={{flex:1,background:C.accF,border:`1px solid ${C.accD}44`,borderRadius:8,color:C.accD,fontSize:11,fontWeight:700,padding:"8px 10px",display:"flex",alignItems:"center",justifyContent:"center",gap:5,transition:"all .15s"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=C.acc;e.currentTarget.style.color=C.acc}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=C.accD+"44";e.currentTarget.style.color=C.accD}}>
              {I.plus} Add Exercise
            </button>
            <button onClick={onAdd}
              style={{flex:1,background:"transparent",border:`1px dashed ${C.bdr}`,borderRadius:8,color:C.mut,fontSize:11,fontWeight:600,padding:"8px 10px",display:"flex",alignItems:"center",justifyContent:"center",gap:5,transition:"all .15s"}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=color;e.currentTarget.style.color=color}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bdr;e.currentTarget.style.color=C.mut}}>
              {I.plus} Custom
            </button>
          </div>
        </>
      )}
    </div>
  );
};

// ─── Commence Workout View ────────────────────────────────────────────────────
const CommenceWorkout = ({workout,onChange,onPRUpdate,prs,onExit}) => {
  const allEx = [
    ...workout.sections.warmup.map(e=>({...e,sec:"warmup",secLabel:"Warm-Up",secColor:C.war})),
    ...workout.sections.exercises.map(e=>({...e,sec:"exercises",secLabel:"Exercises",secColor:C.acc})),
    ...workout.sections.cooldown.map(e=>({...e,sec:"cooldown",secLabel:"Cool Down",secColor:C.ice})),
  ];
  const [idx,setIdx]=useState(0);
  const [logged,setLogged]=useState(false);
  const [finalTime,setFinalTime]=useState("");
  // ── Session timer ──────────────────────────────────────────────────────────
  const [elapsed,setElapsed]=useState(0);
  const startTs=useRef(Date.now());
  useEffect(()=>{
    const tick=setInterval(()=>setElapsed(Math.floor((Date.now()-startTs.current)/1000)),1000);
    return ()=>clearInterval(tick);
  },[]);
  const fmtElapsed=s=>{
    const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
    if(h>0) return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  };
  // ──────────────────────────────────────────────────────────────────────────
  const total=allEx.length;
  const cur=allEx[idx]||allEx[0];
  const isLast=idx===total-1;

  const updateEx=(updated)=>{
    const sec=cur.sec;
    const exs=workout.sections[sec].map(e=>e.id===cur.id?updated:e);
    onChange({...workout,sections:{...workout.sections,[sec]:exs}});
  };

  const next=()=>{ if(!isLast) setIdx(i=>i+1); };
  const prev=()=>{ if(idx>0) setIdx(i=>i-1); };

  const finishSession=()=>{
    const duration=fmtElapsed(Math.floor((Date.now()-startTs.current)/1000));
    const {prs:newPRs,hits}=detectPRs(workout.sections,prs);
    onPRUpdate(newPRs);
    const snap={};
    for(const [sec,exs] of Object.entries(workout.sections)){
      snap[sec]=exs.map(ex=>({...ex,prevSets:ex.sets.map(s=>({reps:s.reps,load:s.load})),sets:ex.sets.map(s=>({...s,done:false}))}));
    }
    onChange({...workout,sections:snap,sessions:[...workout.sessions,{id:uid(),ts:Date.now(),duration}]});
    toast(hits.length>0?"🏆 New PR"+(hits.length>1?"s":"")+"! "+hits.slice(0,2).join(", ")+(hits.length>2?" +"+(hits.length-2)+" more":""):"Session logged ✓");
    setFinalTime(duration);
    setLogged(true);
    setTimeout(()=>{ setLogged(false); onExit(); },3000);
  };

  const liveEx=workout.sections[cur.sec].find(e=>e.id===cur.id)||cur;
  const exPR=prs&&liveEx.name?prs[liveEx.name.trim()]:null;
  const isPR=s=>{
    if(!exPR) return false;
    const l=parseFloat(s.load)||0,r=parseInt(s.reps)||0;
    return (l>0&&l>=exPR.bestLoad)||(r>0&&r>=exPR.bestReps);
  };
  const doneSets=liveEx.sets.filter(s=>s.done).length;
  const allDone=liveEx.sets.length>0&&doneSets===liveEx.sets.length;

  return (
    <div style={{position:"fixed",inset:0,zIndex:500,background:C.bg,display:"flex",flexDirection:"column",fontFamily:"'DM Mono','Courier New',monospace"}}>
      {/* Header */}
      <div style={{paddingTop:"max(env(safe-area-inset-top,20px) + 10px,28px)",padding:"max(env(safe-area-inset-top,20px) + 10px,28px) 18px 0"}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:12}}>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <span style={{color:cur.secColor,fontSize:10,fontWeight:800,textTransform:"uppercase",letterSpacing:1.5}}>{cur.secLabel}</span>
            <span style={{color:C.dim,fontSize:10}}>·</span>
            <span style={{color:C.mut,fontSize:10}}>{idx+1} of {total}</span>
          </div>
          {/* Session timer */}
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{display:"flex",alignItems:"center",gap:5,background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:20,padding:"4px 10px"}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={C.acc} strokeWidth="2" strokeLinecap="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              <span style={{fontSize:12,fontWeight:800,color:C.acc,letterSpacing:1,fontVariantNumeric:"tabular-nums"}}>{fmtElapsed(elapsed)}</span>
            </div>
            <button onClick={onExit}
              style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:20,color:C.mut,fontSize:11,fontWeight:700,padding:"5px 12px",display:"flex",alignItems:"center",gap:5}}>
              {I.x} Exit
            </button>
          </div>
        </div>
        {/* Progress bar */}
        <div style={{height:3,background:C.bdr,borderRadius:2,marginBottom:20}}>
          <div style={{height:"100%",width:`${((idx+1)/total)*100}%`,background:cur.secColor,borderRadius:2,transition:"width .3s ease"}}/>
        </div>
      </div>

      {/* Exercise content */}
      <div style={{flex:1,overflowY:"auto",padding:"0 18px"}}>
        <h2 style={{fontSize:26,fontWeight:800,color:C.txt,marginBottom:4,lineHeight:1.2}}>{liveEx.name||"Exercise"}</h2>
        {liveEx.sets.length>0&&(
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
            <span style={{fontSize:11,fontWeight:800,borderRadius:20,padding:"3px 10px",background:allDone?C.grn:C.accF,color:allDone?"#0a0a0c":C.accD,border:`1px solid ${allDone?C.grn:C.accD+"44"}`,transition:"all .3s"}}>
              {doneSets}/{liveEx.sets.length} sets done
            </span>
            {allDone&&<span style={{fontSize:13}}>✅</span>}
          </div>
        )}
        <FormCues name={liveEx.name}/>
        {liveEx.timerDuration&&(
          <ExerciseTimer duration={liveEx.timerDuration} onChangeDuration={v=>updateEx({...liveEx,timerDuration:v})}/>
        )}
        {(liveEx.prevSets||[]).length>0&&(
          <div style={{fontSize:9,color:C.dim,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:6,paddingLeft:28}}>↑ prev session</div>
        )}
        <div style={{marginBottom:12}}>
          {liveEx.sets.map((s,i)=>(
            <SetRow key={s.id} set={s} idx={i} prevSet={(liveEx.prevSets||[])[i]||null} isPR={isPR(s)}
              onChange={u=>updateEx({...liveEx,sets:liveEx.sets.map((ss,j)=>j===i?u:ss)})}
              onDelete={()=>updateEx({...liveEx,sets:liveEx.sets.filter((_,j)=>j!==i)})}/>
          ))}
          <button onClick={()=>{
            const last=liveEx.sets[liveEx.sets.length-1]||{reps:10,load:0};
            updateEx({...liveEx,sets:[...liveEx.sets,mkSet(last.reps,last.load)]});
          }} style={{background:C.accF,border:`1px dashed ${C.accD}`,borderRadius:6,color:C.accD,fontSize:11,fontWeight:600,padding:"6px 12px",marginTop:4,display:"flex",alignItems:"center",gap:5}}>
            {I.plus} Add set
          </button>
        </div>
      </div>

      {/* Bottom nav */}
      <div style={{padding:"12px 18px",paddingBottom:"max(env(safe-area-inset-bottom,16px) + 12px,24px)",borderTop:`1px solid ${C.bdr}`,background:C.bg}}>
        {logged?(
          <div style={{textAlign:"center",padding:"16px 0"}}>
            <div style={{fontSize:14,color:C.grn,fontWeight:800,marginBottom:6}}>✓ Session complete!</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={C.acc} strokeWidth="2" strokeLinecap="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
              </svg>
              <span style={{fontSize:22,fontWeight:800,color:C.acc,letterSpacing:2}}>{finalTime}</span>
            </div>
            <div style={{fontSize:11,color:C.mut,marginTop:4}}>Total workout time</div>
          </div>
        ):(
          <div style={{display:"grid",gridTemplateColumns:idx>0?"1fr 2fr":"1fr",gap:8}}>
            {idx>0&&(
              <button onClick={prev}
                style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:10,color:C.mut,fontSize:13,fontWeight:700,padding:"14px",fontFamily:"inherit"}}>
                ← Back
              </button>
            )}
            {isLast?(
              <button onClick={finishSession}
                style={{background:C.grn,border:"none",borderRadius:10,color:"#0a0a0c",fontSize:13,fontWeight:800,padding:"14px",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
                {I.log} Finish & Log Session
              </button>
            ):(
              <button onClick={next}
                style={{background:C.acc,border:"none",borderRadius:10,color:"#0a0a0c",fontSize:13,fontWeight:800,padding:"14px",fontFamily:"inherit"}}>
                Next Exercise →
              </button>
            )}
          </div>
        )}
      </div>
    </div>
  );
};

const Ring = ({pct,size=76,stroke=7,color=C.acc,children}) => {
  const r=(size-stroke)/2, ci=2*Math.PI*r;
  return (
    <div style={{position:"relative",width:size,height:size}}>
      <svg width={size} height={size} style={{transform:"rotate(-90deg)"}}>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={C.bdr} strokeWidth={stroke}/>
        <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
          strokeDasharray={ci} strokeDashoffset={ci*(1-pct)} strokeLinecap="round" style={{transition:"stroke-dashoffset .6s ease"}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>{children}</div>
    </div>
  );
};

// ─── Workout Tab ──────────────────────────────────────────────────────────────
const WorkoutTab = ({workout,onChange,onDelete,onDuplicate,prs,onPRUpdate}) => {
  const [editTitle,setEditTitle]=useState(false);
  const [logged,setLogged]=useState(false);
  const [delModal,setDelModal]=useState(false);
  const [picker,setPicker]=useState(null);
  const [commenced,setCommenced]=useState(false);
  // Session timer — starts only when user presses Start or Log, not on mount
  const [elapsed,setElapsed]=useState(0);
  const [timerActive,setTimerActive]=useState(false);
  const startTs=useRef(null);
  const titleRef=useRef();
  useEffect(()=>{ if(editTitle) titleRef.current?.focus(); },[editTitle]);
  useEffect(()=>{
    if(!timerActive) return;
    const tick=setInterval(()=>setElapsed(Math.floor((Date.now()-startTs.current)/1000)),1000);
    return ()=>clearInterval(tick);
  },[timerActive]);
  const fmtElapsed=s=>{
    const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
    if(h>0) return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
    return `${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  };
  const startTimer=()=>{
    if(!timerActive){
      startTs.current=Date.now();
      setTimerActive(true);
    }
  };

  const updSec=(sec,exs)=>onChange({...workout,sections:{...workout.sections,[sec]:exs}});
  const addEx=sec=>updSec(sec,[...workout.sections[sec],mkEx()]);
  const addLib=(sec,name)=>updSec(sec,[...workout.sections[sec],mkEx(name)]);
  const delEx=(sec,id)=>updSec(sec,workout.sections[sec].filter(e=>e.id!==id));

  const logSession=()=>{
    startTimer(); // start if not already running
    const duration=fmtElapsed(Math.floor((Date.now()-(startTs.current||Date.now()))/1000));
    const {prs:newPRs,hits}=detectPRs(workout.sections,prs);
    onPRUpdate(newPRs);
    const snap={};
    for(const [sec,exs] of Object.entries(workout.sections)){
      snap[sec]=exs.map(ex=>({...ex,prevSets:ex.sets.map(s=>({reps:s.reps,load:s.load})),sets:ex.sets.map(s=>({...s,done:false}))}));
    }
    onChange({...workout,sections:snap,sessions:[...workout.sessions,{id:uid(),ts:Date.now(),duration}]});
    setLogged(true);
    setTimerActive(false);
    setElapsed(0);
    toast(hits.length>0?"🏆 New PR"+(hits.length>1?"s":"")+"! "+hits.slice(0,2).join(", ")+(hits.length>2?" +"+(hits.length-2)+" more":""):"Session logged ✓");
    setTimeout(()=>{ setLogged(false); },2500);
  };
  const delSess=sid=>onChange({...workout,sessions:workout.sessions.filter(s=>s.id!==sid)});

  const totalSets=Object.values(workout.sections).flat().reduce((a,e)=>a+e.sets.length,0);
  const totalEx=Object.values(workout.sections).flat().length;
  const count=workout.sessions.length;
  const last=count>0?workout.sessions[workout.sessions.length-1]:null;

  return (
    <div>
      {commenced&&<CommenceWorkout workout={workout} onChange={onChange} onPRUpdate={onPRUpdate} prs={prs} onExit={()=>setCommenced(false)}/>}
      {delModal&&<DelModal title={workout.title} sc={count} onConfirm={onDelete} onCancel={()=>setDelModal(false)}/>}
      {picker&&<Picker onSelect={n=>addLib(picker,n)} onClose={()=>setPicker(null)}/>}

      {/* Title */}
      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
        {editTitle
          ? <input ref={titleRef} value={workout.title} onChange={e=>onChange({...workout,title:e.target.value})}
              onBlur={()=>setEditTitle(false)} onKeyDown={e=>e.key==="Enter"&&setEditTitle(false)}
              style={{background:"transparent",border:"none",borderBottom:`2px solid ${C.acc}`,color:C.txt,fontSize:20,fontWeight:800,outline:"none",fontFamily:"inherit",flex:1,paddingBottom:2}}/>
          : <h2 onClick={()=>setEditTitle(true)} style={{margin:0,fontSize:20,fontWeight:800,color:C.txt,cursor:"pointer",flex:1}}>{workout.title}</h2>
        }
        <button onClick={()=>setEditTitle(!editTitle)} style={{background:"none",border:"none",color:editTitle?C.acc:C.mut,padding:6,display:"flex"}}>
          {editTitle?I.tick:I.edit}
        </button>
        <button onClick={onDuplicate} title="Duplicate workout"
          style={{background:"none",border:"none",color:C.mut,padding:6,display:"flex",transition:"color .15s"}}
          onMouseEnter={e=>e.currentTarget.style.color=C.acc} onMouseLeave={e=>e.currentTarget.style.color=C.mut}>
          {I.copy}
        </button>
        <button onClick={()=>setDelModal(true)} style={{background:"none",border:"none",color:C.dim,padding:6,display:"flex",transition:"color .15s"}}
          onMouseEnter={e=>e.currentTarget.style.color=C.red} onMouseLeave={e=>e.currentTarget.style.color=C.dim}>{I.trash}</button>
      </div>

      {/* Quick stats */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:18}}>
        {[{l:"Exercises",v:totalEx,c:C.acc},{l:"Sets",v:totalSets,c:C.war},{l:"Sessions",v:count,c:C.grn}].map(s=>(
          <div key={s.l} style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:8,padding:"10px 12px"}}>
            <div style={{color:C.mut,fontSize:9,fontWeight:700,textTransform:"uppercase",letterSpacing:1}}>{s.l}</div>
            <div style={{color:s.c,fontSize:22,fontWeight:800,marginTop:3}}>{s.v}</div>
          </div>
        ))}
      </div>

      {last&&(
        <div style={{background:C.grnF,border:`1px solid ${C.grn}33`,borderRadius:8,padding:"9px 12px",marginBottom:18,display:"flex",alignItems:"center",gap:8}}>
          <span style={{color:C.grn}}>{I.hist}</span>
          <span style={{color:C.grn,fontSize:11,fontWeight:600}}>Last completed {ago(last.ts)}</span>
        </div>
      )}

      <SessHistory sessions={workout.sessions} onDelete={delSess}/>

      <Section label="Warm-Up"   icon={I.fire} color={C.war} prs={prs}
        exercises={workout.sections.warmup}    onChange={ex=>updSec("warmup",ex)}
        onAdd={()=>addEx("warmup")}    onLib={()=>setPicker("warmup")}    onDel={id=>delEx("warmup",id)}/>
      <Section label="Exercises" icon={I.bar}  color={C.acc} prs={prs}
        exercises={workout.sections.exercises} onChange={ex=>updSec("exercises",ex)}
        onAdd={()=>addEx("exercises")} onLib={()=>setPicker("exercises")} onDel={id=>delEx("exercises",id)}/>
      <Section label="Cool Down" icon={I.snow} color={C.ice} prs={prs}
        exercises={workout.sections.cooldown}  onChange={ex=>updSec("cooldown",ex)}
        onAdd={()=>addEx("cooldown")}  onLib={()=>setPicker("cooldown")}  onDel={id=>delEx("cooldown",id)}/>

      {/* Session timer + Start/Log buttons */}
      <div style={{marginTop:8}}>
        {/* Timer display — only shown once active */}
        {timerActive&&(
          <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,marginBottom:8}}>
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={logged?C.grn:C.acc} strokeWidth="2" strokeLinecap="round">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            <span style={{fontSize:12,color:logged?C.grn:C.acc,fontWeight:700,letterSpacing:1,fontVariantNumeric:"tabular-nums"}}>
              {logged?"Logged!":fmtElapsed(elapsed)}
            </span>
          </div>
        )}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <button onClick={()=>{ startTimer(); setCommenced(true); }}
            style={{background:C.sur,border:`1px solid ${C.acc}`,borderRadius:10,color:C.acc,fontSize:13,fontWeight:800,padding:"13px",display:"flex",alignItems:"center",justifyContent:"center",gap:7,fontFamily:"inherit",transition:"all .2s"}}
            onMouseEnter={e=>e.currentTarget.style.background=C.accF}
            onMouseLeave={e=>e.currentTarget.style.background=C.sur}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Start
          </button>
          <button onClick={logSession}
            style={{background:logged?C.grn:C.acc,border:"none",borderRadius:10,color:"#0a0a0c",fontSize:13,fontWeight:800,padding:"13px",display:"flex",alignItems:"center",justifyContent:"center",gap:8,fontFamily:"inherit",transition:"background .3s,box-shadow .3s",letterSpacing:.5,boxShadow:logged?`0 0 24px ${C.grn}55`:`0 0 20px ${C.acc}33`}}>
            {I.log} {logged?"Logged ✓":"Log"}
          </button>
        </div>
      </div>
    </div>
  );
};

const getWeekStart = () => {
  const now = new Date();
  const day = now.getDay(); // 0=Sun..6=Sat
  const diff = (day===0?-6:1-day); // shift to Monday
  const mon = new Date(now);
  mon.setHours(0,0,0,0);
  mon.setDate(now.getDate()+diff);
  return mon.getTime();
};

const StatsTab = ({workouts,prs,weeklyGoal,onSetGoal}) => {
  const [prQ,setPrQ]=useState("");

  const [goalDraft,setGoalDraft]=useState(weeklyGoal);
  const [showAllPRs,setShowAllPRs]=useState(false);

  const weekStart=getWeekStart();
  const allSess=workouts.flatMap(w=>w.sessions.map(s=>({...s,wt:w.title})));
  const weekSess=allSess.filter(s=>s.ts>=weekStart);
  const totSess=allSess.length;
  const totEx=workouts.flatMap(w=>Object.values(w.sections).flat()).length;
  const totSets=workouts.flatMap(w=>Object.values(w.sections).flat()).reduce((a,e)=>a+e.sets.length,0);
  const totVol=workouts.flatMap(w=>Object.values(w.sections).flat()).flatMap(e=>e.sets).reduce((a,s)=>a+(parseFloat(s.reps)||0)*(parseFloat(s.load)||0),0);
  const recent=[...allSess].sort((a,b)=>b.ts-a.ts).slice(0,6);
  const prList=Object.entries(prs||{}).filter(([n])=>n.toLowerCase().includes(prQ.toLowerCase())).sort((a,b)=>b[1].date-a[1].date);
  const totPRs=Object.keys(prs||{}).length;

  const wCount=weekSess.length;
  const reached=wCount>=weeklyGoal;

  const saveGoal=()=>{
    const v=Math.max(1,Math.min(14,parseInt(goalDraft)||4));
    onSetGoal(v);
    setGoalDraft(v);
    setEditGoal(false);
  };

  // day labels for this week
  const dayLabels=["M","T","W","T","F","S","S"];
  const dayDots=dayLabels.map((_,i)=>{
    const d=new Date(weekStart+i*86400000);
    d.setHours(0,0,0,0);
    const next=new Date(d); next.setDate(d.getDate()+1);
    const hit=weekSess.some(s=>s.ts>=d.getTime()&&s.ts<next.getTime());
    return {label:dayLabels[i],hit};

  return (

          <Ring pct={Math.min(wCount/weeklyGoal,1)} color={reached?C.grn:C.acc}>

            <div style={{fontSize:10,color:C.mut,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,marginBottom:3}}>This Week</div>

              {wCount}
              {editGoal
                ? <span style={{fontSize:14,fontWeight:500,color:C.mut}}>
                    /
                    <input value={goalDraft} onChange={e=>setGoalDraft(e.target.value)} onBlur={saveGoal} onKeyDown={e=>e.key==="Enter"&&saveGoal()}
                      type="number" min="1" max="14"
                      style={{background:"transparent",border:"none",borderBottom:`1px solid ${C.acc}`,color:C.acc,fontSize:18,fontWeight:800,width:36,outline:"none",fontFamily:"inherit",textAlign:"center",marginLeft:2}}
                      autoFocus/>
                    <span style={{fontSize:12}}> sessions</span>
                  </span>
                : <span style={{color:C.mut,fontSize:14,fontWeight:500}}>/{weeklyGoal} goal</span>
              }
            </div>
            <div style={{fontSize:11,color:reached?C.grn:C.accD,marginTop:3}}>
              {reached?"🎯 Weekly goal reached!":wCount===0?"Log a session to get started":`${weeklyGoal-wCount} more to hit your goal`}
            </div>
          </div>
          {/* edit goal button */}
          <button onClick={()=>{setEditGoal(!editGoal);setGoalDraft(weeklyGoal);}}
            title="Set weekly goal"
            style={{background:"none",border:`1px solid ${editGoal?C.acc:C.bdr}`,borderRadius:7,color:editGoal?C.acc:C.mut,padding:"5px 8px",display:"flex",alignItems:"center",gap:4,fontSize:10,fontWeight:700,transition:"all .15s",flexShrink:0}}>
            {I.edit} {editGoal?"Done":"Goal"}

const Onboarding = ({onDone}) => {
  const [idx,setIdx]=useState(0);
  const [exiting,setExiting]=useState(false);
  const [slideDir,setSlideDir]=useState(0);
  const slide=SLIDES[idx];
  const isLast=idx===SLIDES.length-1;
  const accentColor=slide.accent(C);

  const goTo=(newIdx,dir)=>{
    if(newIdx<0||newIdx>=SLIDES.length) return;
    setSlideDir(dir);
    setIdx(newIdx);
    setTimeout(()=>setSlideDir(0),280);
  };
  const next=()=>{ if(isLast){ finish(); return; } goTo(idx+1,-1); };
  const back=()=>goTo(idx-1,1);
  const finish=()=>{ setExiting(true); setTimeout(onDone,350); };

  // Swipe support
  const swipe=useSwipe(
    ()=>{ if(!isLast) goTo(idx+1,-1); else finish(); },
    ()=>{ if(idx>0) goTo(idx-1,1); }
  );

  const slideStyle={
    animation: slideDir!==0
      ? `slide-in-${slideDir<0?"left":"right"} 0.26s cubic-bezier(.25,.46,.45,.94) both`
      : "none",
  };

  return (
    <div style={{position:"fixed",inset:0,zIndex:9000,background:C.bg,display:"flex",flexDirection:"column",fontFamily:"'DM Mono','Courier New',monospace",opacity:exiting?0:1,transition:"opacity .35s"}}
      {...swipe}>

      {/* Header row: back + skip */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",paddingTop:"max(env(safe-area-inset-top, 20px) + 8px, 24px)",paddingLeft:"20px",paddingRight:"20px",paddingBottom:0,flexShrink:0}}>
        {idx>0
          ? <button onClick={back}
              style={{background:"none",border:"none",color:C.mut,fontSize:13,fontWeight:700,padding:"8px 4px",display:"flex",alignItems:"center",gap:4}}>
              ← Back
            </button>
          : <div style={{width:60}}/>
        }
        <button onClick={finish}
          style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:20,color:C.mut,fontSize:12,fontWeight:700,padding:"6px 14px",transition:"all .15s"}}
          onMouseEnter={e=>{e.currentTarget.style.borderColor=C.acc;e.currentTarget.style.color=C.acc}}
          onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bdr;e.currentTarget.style.color=C.mut}}>
          Skip onboarding
        </button>
      </div>

      {/* Scrollable content area — keyed to idx for slide animation */}
      <div key={idx} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-start",padding:"28px 28px 8px",textAlign:"center",overflowY:"auto",...slideStyle}}>

        {/* Emoji circle */}
        <div style={{width:96,height:96,borderRadius:"50%",background:`${accentColor}18`,border:`2px solid ${accentColor}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:44,marginBottom:24,flexShrink:0}}>
          {slide.emoji}
        </div>

        <div style={{fontSize:11,color:accentColor,fontWeight:800,textTransform:"uppercase",letterSpacing:2,marginBottom:8}}>
          {slide.subtitle}
        </div>
        <h1 style={{fontSize:24,fontWeight:800,color:C.txt,margin:"0 0 14px",lineHeight:1.2}}>
          {slide.title}
        </h1>
        <p style={{fontSize:13,color:C.mut,lineHeight:1.7,maxWidth:320,margin:"0 0 24px"}}>
          {slide.body}
        </p>

        {/* Feature pills */}
        {slide.features&&(
          <div style={{display:"flex",flexDirection:"column",gap:8,width:"100%",maxWidth:320,marginBottom:8}}>

  );

// ─── Backup helpers ───────────────────────────────────────────────────────────
const BACKUP_KEY = "fitpr_backup_meta";
const loadBackupMeta = () => { try { const r=localStorage.getItem(BACKUP_KEY); return r?JSON.parse(r):{lastBackup:null,frequency:3}; } catch(e){ return {lastBackup:null,frequency:3}; } };
const saveBackupMeta = m => { try { localStorage.setItem(BACKUP_KEY,JSON.stringify(m)); } catch(e){} };

const backupStatus = lastBackup => {
  if(!lastBackup) return {color:"#ff4d4d",label:"⚠️ No backup yet",level:"red"};
  const days = (Date.now()-lastBackup)/(1000*60*60*24);
  if(days<=3)  return {color:"#2ecc71",label:"✅ Protected",level:"green"};
  if(days<=7)  return {color:"#ff9f43",label:"⚠️ Backup recommended",level:"yellow"};
  return {color:"#ff4d4d",label:"🔴 Backup overdue",level:"red"};
};

const fmtBackupDate = ts => {
  if(!ts) return "Never";
  const d=new Date(ts), now=new Date();
  const isToday=d.toDateString()===now.toDateString();
  const isYesterday=d.toDateString()===new Date(now-86400000).toDateString();
  const time=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
  if(isToday) return `Today, ${time}`;
  if(isYesterday) return `Yesterday, ${time}`;
  return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+`, ${time}`;
};

const triggerDownload = (data) => {
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json],{type:"application/json"});
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  a.href=url; a.download=`fitpr-backup-${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a); URL.revokeObjectURL(url);
};

                <div style={{fontSize:14,fontWeight:800,color:C.txt}}>Backup</div>
                <div style={{fontSize:10,color:st.color,fontWeight:700,marginTop:1}}>{st.label}</div>
              </div>
            </div>
            <button onClick={onClose} style={{background:"none",border:"none",color:C.mut,padding:6,display:"flex"}}>{I.x}</button>
          </div>

          {/* Status rows */}
          <div style={{background:C.bg,borderRadius:10,padding:"12px 14px",marginBottom:16}}>
            {[
              {l:"Last backup",  v:fmtBackupDate(meta.lastBackup)},
              {l:"Format",       v:"JSON · Local device"},
              {l:"Frequency",    v:freq===0?"Manual only":freq===1?"Daily":`Every ${freq} days`},
              {l:"Age",          v:days===null?"Never backed up":days===0?"Today":days===1?"1 day ago":`${days} days ago`},
            ].map((r,i,arr)=>(
              <div key={r.l} style={{display:"flex",alignItems:"center",justifyContent:"space-between",paddingBottom:i<arr.length-1?10:0,marginBottom:i<arr.length-1?10:0,borderBottom:i<arr.length-1?`1px solid ${C.bdr}`:"none"}}>
                <span style={{fontSize:11,color:C.mut}}>{r.l}</span>
                <span style={{fontSize:11,fontWeight:700,color:C.txt}}>{r.v}</span>
              </div>
            ))}
          </div>

          {/* Backup now button */}
          <button onClick={onBackupNow}
            style={{width:"100%",background:C.acc,border:"none",borderRadius:10,color:"#0a0a0c",fontSize:13,fontWeight:800,padding:"13px",display:"flex",alignItems:"center",justifyContent:"center",gap:8,fontFamily:"inherit",marginBottom:24,transition:"opacity .15s"}}
            onMouseEnter={e=>e.currentTarget.style.opacity=".85"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            {meta.lastBackup?"Backup Now":"Create First Backup"}
          </button>

          {/* Frequency settings */}
          <div style={{fontSize:10,color:C.mut,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>Reminder Frequency</div>
          {opts.map(o=>(
            <button key={o.v} onClick={()=>{setFreq(o.v);onSaveFreq(o.v);}}
              style={{width:"100%",background:freq===o.v?C.accF:"transparent",border:`1px solid ${freq===o.v?C.acc:C.bdr}`,borderRadius:8,color:freq===o.v?C.acc:C.mut,fontSize:12,fontWeight:freq===o.v?800:500,padding:"10px 14px",marginBottom:6,display:"flex",alignItems:"center",justifyContent:"space-between",transition:"all .15s",textAlign:"left",fontFamily:"inherit"}}>
              <span>{o.l}</span>
              {freq===o.v&&<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polyline points="20 6 9 17 4 12"/></svg>}
            </button>
          ))}
          <div style={{fontSize:11,color:C.dim,marginTop:10,lineHeight:1.6}}>
            A reminder banner appears when a backup is due. Tap it or use the button above to download your data as a .json file.
          </div>

          {/* Save location note */}
          <div style={{background:C.bg,border:`1px solid ${C.bdr}`,borderRadius:10,padding:"12px 14px",marginTop:16}}>
            <div style={{fontSize:10,color:C.mut,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,marginBottom:10}}>Where is my file saved?</div>
            {[
              {icon:"📱",label:"iOS (Safari)",   val:"Files app → Downloads (or iCloud Drive)"},
              {icon:"🤖",label:"Android (Chrome)",val:"Internal storage → Downloads folder"},
              {icon:"💻",label:"Desktop",         val:"Your system Downloads folder"},
            ].map(r=>(
              <div key={r.label} style={{display:"flex",alignItems:"flex-start",gap:10,marginBottom:8}}>
                <span style={{fontSize:14,flexShrink:0,marginTop:1}}>{r.icon}</span>
                <div>
                  <div style={{fontSize:11,fontWeight:700,color:C.txt}}>{r.label}</div>
                  <div style={{fontSize:10,color:C.mut,marginTop:1}}>{r.val}</div>
                </div>
              </div>
            ))}
            <div style={{borderTop:`1px solid ${C.bdr}`,marginTop:8,paddingTop:10,fontSize:10,color:C.dim,lineHeight:1.6}}>
              Tip: on iOS, tap <span style={{color:C.mut,fontWeight:700}}>"Save to Files"</span> after downloading and choose a folder like <span style={{color:C.mut,fontWeight:700}}>FitPR/Backups</span> to keep things organised. The filename includes today's date, e.g. <span style={{color:C.acc}}>fitpr-backup-{new Date().toISOString().slice(0,10)}.json</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
};

// ─── Swipe hook ───────────────────────────────────────────────────────────────
const useSwipe = (onLeft, onRight, threshold=50) => {
  const x0 = useRef(null);
  const y0 = useRef(null);
  const locked = useRef(null); // "h" | "v" | null
  return {
    onTouchStart: e => {
      x0.current = e.touches[0].clientX;
      y0.current = e.touches[0].clientY;
      locked.current = null;
    },
    onTouchMove: e => {
      if(!x0.current) return;
      const dx = e.touches[0].clientX - x0.current;
      const dy = e.touches[0].clientY - y0.current;
      if(!locked.current) locked.current = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
      if(locked.current === "h") e.preventDefault(); // prevent scroll only on horizontal
    },
    onTouchEnd: e => {
      if(!x0.current || locked.current !== "h") return;
      const dx = e.changedTouches[0].clientX - x0.current;
      if(dx < -threshold) onLeft();
      else if(dx > threshold) onRight();
      x0.current = null;
    },
  };
};

// ─── App ──────────────────────────────────────────────────────────────────────
function App(){
  const init=initState();
  const [workouts,setWorkouts]=useState(init.workouts);
  const [tab,setTab]=useState(init.tab||"stats");
  const [prs,setPrs]=useState(init.prs||{});
  const [weeklyGoal,setWeeklyGoal]=useState(init.weeklyGoal||4);
  const [onboarded,setOnboarded]=useState(init.onboarded!==false);
  const [slideDir,setSlideDir]=useState(0);
  const [backupMeta,setBackupMeta]=useState(loadBackupMeta);
  const [backupReminder,setBackupReminder]=useState(false);
  const [backupPanel,setBackupPanel]=useState(false);
  const contentRef=useRef();

  useEffect(()=>{ save({workouts,tab,prs,weeklyGoal,onboarded}); },[workouts,tab,prs,weeklyGoal,onboarded]);

  // Check if backup reminder should show
  useEffect(()=>{
    const check=()=>{
      const {lastBackup,frequency}=backupMeta;
      if(frequency===0) return; // manual only
      if(!lastBackup){ setBackupReminder(true); return; }
      const days=(Date.now()-lastBackup)/(1000*60*60*24);
      setBackupReminder(days>=frequency);
    };
    check();
    const timer=setInterval(check, 60*60*1000); // re-check every hour
    return ()=>clearInterval(timer);
  },[backupMeta]);

  const doBackup=()=>{
    triggerDownload({workouts,prs,exportedAt:new Date().toISOString()});
    const updated={...backupMeta,lastBackup:Date.now()};
    setBackupMeta(updated);
    saveBackupMeta(updated);
    setBackupReminder(false);
    toast("💾 Backup saved to your device");
  };

  const saveBackupFreq=freq=>{
    const updated={...backupMeta,frequency:freq};
    setBackupMeta(updated);
    saveBackupMeta(updated);
  };

  const tabIds = ["stats", ...workouts.map(w=>w.id)];
  const goToTab=(newTab,dir)=>{ setSlideDir(dir); setTab(newTab); setTimeout(()=>setSlideDir(0),320); };
  const swipeLeft=()=>{ const i=tabIds.indexOf(tab); if(i<tabIds.length-1) goToTab(tabIds[i+1],-1); };
  const swipeRight=()=>{ const i=tabIds.indexOf(tab); if(i>0) goToTab(tabIds[i-1],1); };
  const swipe=useSwipe(swipeLeft,swipeRight);

  const addW=()=>{ const w=mkWork(workouts.length+1); setWorkouts(p=>[...p,w]); goToTab(w.id,-1); };
  const updW=(id,u)=>setWorkouts(p=>p.map(w=>w.id===id?u:w));
  const delW=id=>{ setWorkouts(p=>p.filter(w=>w.id!==id)); goToTab("stats",1); };
  const dupW=id=>{
    const src=workouts.find(w=>w.id===id);
    if(!src) return;
    // Deep-copy sections, giving every exercise and set a fresh id
    const copySection=exs=>exs.map(ex=>({
      ...ex, id:uid(), sessions:[],
      sets:ex.sets.map(s=>({...s,id:uid(),done:false})),
      prevSets:[],
    }));
    const w={
      ...src, id:uid(),
      title:`${src.title} (copy)`,
      sessions:[],
      sections:{
        warmup:    copySection(src.sections.warmup),
        exercises: copySection(src.sections.exercises),
        cooldown:  copySection(src.sections.cooldown),
      },
    };
    setWorkouts(p=>[...p,w]);
    goToTab(w.id,-1);
    toast(`Duplicated "${src.title}"`);
  };

  const active=workouts.find(w=>w.id===tab);
  const totSess=workouts.reduce((a,w)=>a+w.sessions.length,0);
  const slideStyle={animation:slideDir!==0?`slide-in-${slideDir<0?"left":"right"} 0.28s cubic-bezier(.25,.46,.45,.94) both`:"none"};

  return (
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:"'DM Mono','Courier New',monospace",color:C.txt}}>
      {!onboarded&&<Onboarding onDone={()=>setOnboarded(true)}/>}
      <style>{`
        @keyframes slide-in-left  { from{opacity:.4;transform:translateX(48px)} to{opacity:1;transform:translateX(0)} }
        @keyframes slide-in-right { from{opacity:.4;transform:translateX(-48px)} to{opacity:1;transform:translateX(0)} }
        @keyframes slide-up { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
      `}</style>

      {/* Backup panel */}
      {backupPanel&&<BackupPanel meta={backupMeta} onBackupNow={()=>{doBackup();setBackupPanel(false);}} onSaveFreq={saveBackupFreq} onClose={()=>setBackupPanel(false)}/>}

      {/* Backup reminder banner */}
      {backupReminder&&(
        <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:1500,background:"#18181d",borderTop:`1px solid ${C.war}55`,padding:"12px 18px 28px",display:"flex",alignItems:"center",gap:12,animation:"slide-up .3s ease both"}}>
          <span style={{fontSize:20,flexShrink:0}}>💾</span>
          <div style={{flex:1}}>
            <div style={{fontSize:12,fontWeight:800,color:C.txt}}>Backup reminder</div>
            <div style={{fontSize:10,color:C.mut,marginTop:2}}>
              {backupMeta.lastBackup
                ? `Last backup was ${Math.floor((Date.now()-backupMeta.lastBackup)/(1000*60*60*24))} days ago`
                : "You haven't backed up yet"}
            </div>
          </div>
          <button onClick={()=>setBackupReminder(false)}
            style={{background:"none",border:"none",color:C.mut,padding:6,display:"flex",flexShrink:0}}>{I.x}</button>
          <button onClick={doBackup}
            style={{background:C.acc,border:"none",borderRadius:8,color:"#0a0a0c",fontSize:12,fontWeight:800,padding:"8px 14px",flexShrink:0,fontFamily:"inherit"}}>
            Backup Now
          </button>
        </div>
      )}

      <div style={{paddingTop:"max(env(safe-area-inset-top, 20px) + 14px, 32px)",paddingLeft:"18px",paddingRight:"18px",paddingBottom:0,maxWidth:480,margin:"0 auto"}}>
        {/* Header */}
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <div style={{width:30,height:30,background:C.acc,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
              <path d="M6 5v14M18 5v14M2 8h4M18 8h4M2 16h4M18 16h4M6 12h12" stroke="#0a0a0c" strokeWidth="2.5" strokeLinecap="round"/>
            </svg>
          </div>
          <div>
            <div style={{fontSize:13,fontWeight:800,letterSpacing:1.5,color:C.txt}}>FitPR</div>
            <div style={{fontSize:8,color:C.mut,letterSpacing:2,textTransform:"uppercase"}}>Fitness Tracker</div>
          </div>
          <div style={{flex:1}}/>
          {/* Backup icon button */}
          {(()=>{const st=backupStatus(backupMeta.lastBackup); return(
            <button onClick={()=>setBackupPanel(true)} title="Backup"
              style={{position:"relative",background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:8,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:C.mut,transition:"all .15s",flexShrink:0}}
              onMouseEnter={e=>{e.currentTarget.style.borderColor=st.color;e.currentTarget.style.color=st.color}}
              onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bdr;e.currentTarget.style.color=C.mut}}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="7 10 12 15 17 10"/>
                <line x1="12" y1="15" x2="12" y2="3"/>
              </svg>
              {/* status dot */}
              <div style={{position:"absolute",top:5,right:5,width:6,height:6,borderRadius:"50%",background:st.color,boxShadow:`0 0 5px ${st.color}99`}}/>
            </button>
          );})()}
          {totSess>0&&(
            <div style={{background:C.grnF,border:`1px solid ${C.grn}44`,color:C.grn,fontSize:10,fontWeight:800,borderRadius:20,padding:"3px 10px"}}>
              {totSess} sessions
            </div>
          )}
        </div>
        {/* Tabs */}
        <div className="tabs">
          <button onClick={()=>goToTab("stats",tabIds.indexOf("stats")<tabIds.indexOf(tab)?1:-1)}
            style={{background:tab==="stats"?C.acc:C.sur,color:tab==="stats"?"#0a0a0c":C.mut,border:`1px solid ${tab==="stats"?C.acc:C.bdr}`,borderBottom:"none",borderRadius:"8px 8px 0 0",padding:"7px 13px",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap",flexShrink:0,transition:"all .15s",letterSpacing:.5}}>
            {I.stats} STATS
          </button>
          {workouts.map(w=>{
            const on=tab===w.id,sc=w.sessions.length,wIdx=tabIds.indexOf(w.id),curIdx=tabIds.indexOf(tab);
            return (
              <button key={w.id} onClick={()=>goToTab(w.id,wIdx<curIdx?1:-1)}
                style={{background:on?C.sur:"transparent",color:on?C.txt:C.mut,border:`1px solid ${on?C.bdr:"transparent"}`,borderBottom:on?`1px solid ${C.sur}`:"none",borderRadius:"8px 8px 0 0",padding:"7px 11px",fontSize:10,fontWeight:700,whiteSpace:"nowrap",flexShrink:0,transition:"all .15s",display:"flex",alignItems:"center",gap:6,maxWidth:130,overflow:"hidden"}}>
                <span style={{overflow:"hidden",textOverflow:"ellipsis"}}>{w.title}</span>
                {sc>0&&<span style={{background:C.grn,color:"#0a0a0c",fontSize:9,fontWeight:800,borderRadius:20,padding:"1px 6px",flexShrink:0}}>×{sc}</span>}
              </button>
            );
          })}
          <button onClick={addW}
            style={{background:"transparent",color:C.mut,border:`1px dashed ${C.bdr}`,borderBottom:"none",borderRadius:"8px 8px 0 0",padding:"7px 11px",display:"flex",alignItems:"center",flexShrink:0,transition:"all .15s"}}
            onMouseEnter={e=>{e.currentTarget.style.color=C.acc;e.currentTarget.style.borderColor=C.accD}}
            onMouseLeave={e=>{e.currentTarget.style.color=C.mut;e.currentTarget.style.borderColor=C.bdr}}>
            {I.plus}
          </button>
        </div>
      </div>

      {/* Swipeable content */}
      <div style={{borderTop:`1px solid ${C.bdr}`}} {...swipe} ref={contentRef}>
        <div key={tab} style={{maxWidth:480,margin:"0 auto",padding:"22px 18px 100px",...slideStyle}}>
          {tab==="stats"&&<StatsTab workouts={workouts} prs={prs} weeklyGoal={weeklyGoal} onSetGoal={setWeeklyGoal}/>}
          {active&&<WorkoutTab workout={active} onChange={u=>updW(active.id,u)} onDelete={()=>delW(active.id)} onDuplicate={()=>dupW(active.id)} prs={prs} onPRUpdate={setPrs}/>}
        </div>
      </div>

      {/* Dot indicator */}
      {tabIds.length>1&&(
        <div style={{position:"fixed",bottom:backupReminder?80:16,left:"50%",transform:"translateX(-50%)",display:"flex",gap:5,zIndex:100,pointerEvents:"none",transition:"bottom .3s"}}>
          {tabIds.map(id=>(
            <div key={id} style={{width:id===tab?16:5,height:5,borderRadius:3,background:id===tab?C.acc:C.bdr,transition:"all .3s",opacity:.8}}/>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
// Service Worker
if("serviceWorker" in navigator){
  const sw=`const C="fitpr-v2";self.addEventListener("install",e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(["/"])).then(()=>self.skipWaiting()))});self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});self.addEventListener("fetch",e=>{if(e.request.method!=="GET")return;e.respondWith(caches.match(e.request).then(ca=>{const net=fetch(e.request).then(r=>{if(r.ok){const cl=r.clone();caches.open(C).then(c=>c.put(e.request,cl))}return r}).catch(()=>ca);return ca||net}))});`;
  const blob=new Blob([sw],{type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob),{scope:"/"}).catch(()=>{});
}
// Install prompt
let dp=null;
const banner=document.getElementById("install-banner");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;banner.classList.add("show")});
document.getElementById("btn-install").addEventListener("click",async()=>{if(!dp)return;dp.prompt();const{outcome}=await dp.userChoice;if(outcome==="accepted")banner.classList.remove("show");dp=null});
document.getElementById("btn-dismiss").addEventListener("click",()=>banner.classList.remove("show"));
window.addEventListener("appinstalled",()=>{banner.classList.remove("show");dp=null});
</script>
