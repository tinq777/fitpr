const fmtDate=ts=>{const d=new Date(ts);return d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})+" · "+d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});};
const ago=ts=>{const m=Math.floor((Date.now()-ts)/60000);if(m<1)return"just now";if(m<60)return m+"m ago";const h=Math.floor(m/60);if(h<24)return h+"h ago";return Math.floor(h/24)+"d ago";};
const fmtBD=ts=>{if(!ts)return"Never";const d=new Date(ts),n=new Date(),t=d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});if(d.toDateString()===n.toDateString())return"Today, "+t;if(d.toDateString()===new Date(n-86400000).toDateString())return"Yesterday, "+t;return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})+", "+t;};
const toast=msg=>{const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2400);};
const fmtSecs=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;if(h>0)return`${h}:${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}`;return`${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}`;};

const bkpStatus=last=>{if(!last)return{color:C.red,label:"⚠️ No backup yet",level:"red"};const d=(Date.now()-last)/(1000*60*60*24);if(d<=3)return{color:C.grn,label:"✅ Protected",level:"green"};if(d<=7)return{color:C.war,label:"⚠️ Backup recommended",level:"yellow"};return{color:C.red,label:"🔴 Backup overdue",level:"red"};};

// ── Data factories ────────────────────────────────────────────────────────────
const mkSet=(reps=10,load=0)=>({id:uid(),reps,load,done:false});
const mkEx=(name="")=>({id:uid(),name,sets:[mkSet()],prevSets:[]});
const mkWork=n=>({id:uid(),title:`Workout ${n}`,sessions:[],sections:{warmup:[mkEx("Jumping Jacks")],exercises:[mkEx("Bench Press"),mkEx("Squat")],cooldown:[mkEx("Stretching")]}});
const initState=()=>{const s=load();if(s&&s.workouts&&s.workouts.length)return s;return{workouts:[mkWork(1)],tab:"stats",prs:{},weeklyGoal:4,onboarded:false};};

// ── PR detection (skip first session — no prevSets = baseline) ────────────────
const detectPRs=(sections,oldPRs)=>{
  const prs={...oldPRs};const hits=[];
  for(const exs of Object.values(sections)){
    for(const ex of exs){
      if(!ex.name.trim())continue;
      if(!ex.prevSets||ex.prevSets.length===0)continue; // first session = baseline, no PR
      const n=ex.name.trim();
      const p=prs[n]||{bestLoad:0,bestReps:0,bestVol:0,date:null};
      let changed=false;
      for(const s of ex.sets){
        const load=parseFloat(s.load)||0,reps=parseInt(s.reps)||0,vol=load*reps;
        if(load>p.bestLoad){p.bestLoad=load;changed=true;}
        if(reps>p.bestReps){p.bestReps=reps;changed=true;}
        if(vol>p.bestVol){p.bestVol=vol;changed=true;}
      }
      if(changed){p.date=Date.now();prs[n]=p;hits.push(n);}
    }
  }
  return{prs,hits};
};

// ── useSwipe ──────────────────────────────────────────────────────────────────
const useSwipe=(onLeft,onRight,threshold=50)=>{
  const x0=useRef(null),y0=useRef(null),locked=useRef(null),active=useRef(false);
  return{
    onTouchStart:e=>{e.stopPropagation();x0.current=e.touches[0].clientX;y0.current=e.touches[0].clientY;locked.current=null;active.current=true;},
    onTouchMove:e=>{if(!active.current||!x0.current)return;e.stopPropagation();const dx=e.touches[0].clientX-x0.current,dy=e.touches[0].clientY-y0.current;if(!locked.current)locked.current=Math.abs(dx)>Math.abs(dy)?"h":"v";if(locked.current==="h")e.preventDefault();},
    onTouchEnd:e=>{if(!active.current||!x0.current||locked.current!=="h"){active.current=false;return;}e.stopPropagation();const dx=e.changedTouches[0].clientX-x0.current;if(dx<-threshold)onLeft();else if(dx>threshold)onRight();x0.current=null;active.current=false;},
  };
};

// ── useDragSort ───────────────────────────────────────────────────────────────
const useDragSort=(items,onReorder)=>{
  const [dragIdx,setDragIdx]=useState(null);
  const [overIdx,setOverIdx]=useState(null);
  const [floatY,setFloatY]=useState(0);
  const [cardH,setCardH]=useState(80);
  const listRef=useRef(null);
  const itemEls=useRef([]);
  const st=useRef({dragIdx:null,overIdx:null,startClientY:0,elOffsetInList:0,cardH:80});
  const setRef=(idx,el)=>{itemEls.current[idx]=el;};
  const onDragStart=(idx,e)=>{
    e.preventDefault();e.stopPropagation();
    const cY=e.touches?e.touches[0].clientY:e.clientY;
    const el=itemEls.current[idx];
    const lR=listRef.current?listRef.current.getBoundingClientRect():{top:0};
    const eR=el?el.getBoundingClientRect():{height:80,top:0};
    const h=eR.height+8;
    st.current={dragIdx:idx,overIdx:idx,startClientY:cY,elOffsetInList:eR.top-lR.top,cardH:h};
    setCardH(h);setDragIdx(idx);setOverIdx(idx);setFloatY(eR.top-lR.top);
    document.body.style.overflow="hidden";
    document.body.style.userSelect="none";
    document.body.style.webkitUserSelect="none";
    document.documentElement.style.webkitUserSelect="none";
  };
  useEffect(()=>{
    const onMove=e=>{
      if(st.current.dragIdx===null)return;
      if(e.cancelable)e.preventDefault();
      const cY=e.touches?e.touches[0].clientY:e.clientY;
      const dy=cY-st.current.startClientY;
      const nFY=Math.max(0,Math.min((items.length-1)*st.current.cardH,st.current.elOffsetInList+dy));
      setFloatY(nFY);
      const nO=Math.max(0,Math.min(items.length-1,Math.round(nFY/st.current.cardH)));
      if(nO!==st.current.overIdx){st.current.overIdx=nO;setOverIdx(nO);}
    };
    const onEnd=()=>{
      if(st.current.dragIdx===null)return;
      const{dragIdx,overIdx}=st.current;
      st.current.dragIdx=null;st.current.overIdx=null;
      setDragIdx(null);setOverIdx(null);
      document.body.style.overflow="";
      document.body.style.userSelect="";
      document.body.style.webkitUserSelect="";
      document.documentElement.style.webkitUserSelect="";
      if(dragIdx!==overIdx){const next=[...items];const[moved]=next.splice(dragIdx,1);next.splice(overIdx,0,moved);onReorder(next);}
    };
    window.addEventListener("touchmove",onMove,{passive:false});
    window.addEventListener("touchend",onEnd);
    window.addEventListener("mousemove",onMove);
    window.addEventListener("mouseup",onEnd);
    return()=>{window.removeEventListener("touchmove",onMove);window.removeEventListener("touchend",onEnd);window.removeEventListener("mousemove",onMove);window.removeEventListener("mouseup",onEnd);};
  },[items]);
  const getShift=idx=>{if(dragIdx===null||idx===dragIdx)return 0;const d=dragIdx,o=overIdx;if(d<o&&idx>d&&idx<=o)return -cardH;if(d>o&&idx>=o&&idx<d)return cardH;return 0;};
  const handleProps=idx=>({
    onMouseDown:e=>onDragStart(idx,e),
    onTouchStart:e=>onDragStart(idx,e),
    style:{cursor:dragIdx!==null?"grabbing":"grab",touchAction:"none",userSelect:"none",WebkitUserSelect:"none",WebkitTouchCallout:"none",color:C.dim,padding:"4px 6px",display:"flex",alignItems:"center",flexShrink:0},
    onMouseEnter:e=>{if(dragIdx===null)e.currentTarget.style.color=C.mut;},
    onMouseLeave:e=>{if(dragIdx===null)e.currentTarget.style.color=C.dim;},
  });
  return{listRef,setRef,handleProps,dragIdx,overIdx,floatY,cardH,getShift};
};

const Stepper=({value,onChange,step=1,min=0,label=""})=>{
  const [editing,setEditing]=useState(false);
  const [draft,setDraft]=useState(value);
  const v=parseFloat(value)||0;
  const bs={background:C.surH,border:`1px solid ${C.bdr}`,borderRadius:5,color:C.mut,width:28,height:28,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,transition:"all .12s",padding:0,fontSize:15,fontWeight:700};
  const saveEdit=()=>{const n=parseFloat(draft);if(!isNaN(n))onChange(Math.max(min,parseFloat(n.toFixed(2))));setEditing(false);};
  if(editing)return(
    <div style={{display:"flex",alignItems:"center",gap:4}}>
      <input type="number" value={draft} onChange={e=>setDraft(e.target.value)} onBlur={saveEdit} onKeyDown={e=>e.key==="Enter"&&saveEdit()} autoFocus
        style={{width:64,background:C.sur,border:`1px solid ${C.acc}`,borderRadius:6,color:C.txt,padding:"4px 8px",outline:"none",fontFamily:"inherit",textAlign:"center",fontSize:15}}/>
      {label&&<span style={{fontSize:11,color:C.mut,flexShrink:0}}>{label}</span>}
    </div>
  );
  return(
    <div style={{display:"flex",alignItems:"center",gap:4}}>
      <button style={bs} onMouseEnter={e=>{e.currentTarget.style.borderColor=C.acc;e.currentTarget.style.color=C.acc;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bdr;e.currentTarget.style.color=C.mut;}} onClick={()=>onChange(Math.max(min,parseFloat((v-step).toFixed(2))))}>−</button>
      <div onClick={()=>{setDraft(v);setEditing(true);}} style={{textAlign:"center",minWidth:38,fontSize:13,fontWeight:700,color:C.txt,cursor:"text",userSelect:"none",padding:"2px 0"}}>{v}{label}</div>
      <button style={bs} onMouseEnter={e=>{e.currentTarget.style.borderColor=C.acc;e.currentTarget.style.color=C.acc;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bdr;e.currentTarget.style.color=C.mut;}} onClick={()=>onChange(parseFloat((v+step).toFixed(2)))}>+</button>
    </div>
  );
};

const ExTimer=({duration,onChangeDuration})=>{
  const [running,setRunning]=useState(false);
  const [remaining,setRemaining]=useState(duration);
  const [editing,setEditing]=useState(false);
  const [draftSecs,setDraftSecs]=useState(duration);
  const iRef=useRef(null);
  useEffect(()=>{if(!running)setRemaining(duration);},[duration]);
  useEffect(()=>{
    if(running){iRef.current=setInterval(()=>{setRemaining(r=>{if(r<=1){clearInterval(iRef.current);setRunning(false);if(navigator.vibrate)navigator.vibrate([200,100,200]);try{const ctx=new(window.AudioContext||window.webkitAudioContext)();[0,.3,.6].forEach(o=>{const osc=ctx.createOscillator(),g=ctx.createGain();osc.connect(g);g.connect(ctx.destination);osc.frequency.value=880;g.gain.setValueAtTime(.4,ctx.currentTime+o);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+o+.25);osc.start(ctx.currentTime+o);osc.stop(ctx.currentTime+o+.25);});}catch(e){}return 0;}return r-1;});},1000);}else{clearInterval(iRef.current);}
    return()=>clearInterval(iRef.current);
  },[running]);
  const toggle=()=>{if(remaining===0){setRemaining(duration);setTimeout(()=>setRunning(true),50);return;}setRunning(r=>!r);};
  const reset=()=>{setRunning(false);setRemaining(duration);};
  const saveEdit=()=>{const v=Math.max(1,Math.min(3600,parseInt(draftSecs)||30));onChangeDuration(v);setRemaining(v);setRunning(false);setEditing(false);};
  const done=remaining===0;
  const pct=duration>0?remaining/duration:0;
  const mins=Math.floor(remaining/60),secs=remaining%60;
  const timeStr=mins>0?`${mins}:${String(secs).padStart(2,"0")}`:secs+"s";
  const ringColor=done?C.grn:running?C.acc:C.mut;
  const sz=52,st=4,r=(sz-st)/2,circ=2*Math.PI*r;
  return(
    <div style={{background:done?C.grnF:running?C.accF:C.bg,border:`1px solid ${done?C.grn+"55":running?C.acc+"44":C.bdr}`,borderRadius:10,padding:"10px 12px",marginBottom:8,display:"flex",alignItems:"center",gap:12,transition:"all .3s"}}>
      <div style={{cursor:"pointer",position:"relative",width:sz,height:sz,flexShrink:0}} onClick={toggle}>
        <svg width={sz} height={sz} style={{transform:"rotate(-90deg)"}}>
          <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={C.bdr} strokeWidth={st}/>
          <circle cx={sz/2} cy={sz/2} r={r} fill="none" stroke={ringColor} strokeWidth={st} strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} strokeLinecap="round" style={{transition:running?"stroke-dashoffset 1s linear":"stroke-dashoffset .3s ease"}}/>
        </svg>
        <div style={{position:"absolute",inset:0,display:"flex",alignItems:"center",justifyContent:"center"}}>
          <span style={{fontSize:done?16:11,fontWeight:800,color:ringColor,lineHeight:1}}>{done?"✓":timeStr}</span>
        </div>
      </div>
      <div style={{flex:1}}>
        <div style={{fontSize:10,color:C.mut,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:5}}>{done?"Complete!":running?"Running…":"Timer"}</div>
        {editing?(
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <input type="number" value={draftSecs} onChange={e=>setDraftSecs(e.target.value)} onBlur={saveEdit} onKeyDown={e=>e.key==="Enter"&&saveEdit()} style={{width:64,background:C.sur,border:`1px solid ${C.acc}`,borderRadius:6,color:C.txt,padding:"4px 8px",outline:"none",fontFamily:"inherit",textAlign:"center"}} autoFocus/>
            <span style={{fontSize:11,color:C.mut}}>seconds</span>
            <button onClick={saveEdit} style={{background:C.acc,border:"none",borderRadius:6,color:"#0a0a0c",fontSize:11,fontWeight:800,padding:"4px 10px",fontFamily:"inherit"}}>Set</button>

const ExCard=({exercise,onChange,onDelete,prs,dragHandleProps})=>{
  const [col,setCol]=useState(true);
  const updSet=(i,u)=>onChange({...exercise,sets:exercise.sets.map((s,j)=>j===i?u:s)});
  const delSet=i=>onChange({...exercise,sets:exercise.sets.filter((_,j)=>j!==i)});
  const addSet=()=>{const last=exercise.sets[exercise.sets.length-1]||{reps:10,load:0};onChange({...exercise,sets:[...exercise.sets,mkSet(last.reps,last.load)]});};
  const timerOn=!!(exercise.timerDuration);
  const toggleTimer=()=>{if(timerOn){const{timerDuration:_,...rest}=exercise;onChange(rest);}else{onChange({...exercise,timerDuration:30});}};
  const prev=exercise.prevSets||[];
  const done=exercise.sets.filter(s=>s.done).length;
  const all=exercise.sets.length>0&&done===exercise.sets.length;
  const exPR=prs&&exercise.name?prs[exercise.name.trim()]:null;
  const isPR=s=>{
    if(!exPR)return false;
    if(!exercise.prevSets||exercise.prevSets.length===0)return false;
    const l=parseFloat(s.load)||0,r=parseInt(s.reps)||0;
    return(l>0&&l>=exPR.bestLoad)||(r>0&&r>=exPR.bestReps);
  };
  return(
    <div className="ex-card" style={{background:C.sur,border:`1px solid ${all?C.grn+"55":C.bdr}`,borderRadius:10,padding:"12px 14px",marginBottom:8,transition:"border-color .3s"}}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:col?0:10}}>
        {dragHandleProps&&(
          <div {...dragHandleProps} data-drag-handle="true" style={{...dragHandleProps.style,color:C.dim}}>
            <svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor"><circle cx="4" cy="3" r="1.5"/><circle cx="8" cy="3" r="1.5"/><circle cx="4" cy="8" r="1.5"/><circle cx="8" cy="8" r="1.5"/><circle cx="4" cy="13" r="1.5"/><circle cx="8" cy="13" r="1.5"/></svg>
          </div>
        )}
        <div style={{flex:1,minWidth:0}}>
          <Inp value={exercise.name} onChange={v=>onChange({...exercise,name:v})} placeholder="Exercise name"
            style={{fontWeight:600,fontSize:13,background:"transparent",border:"none",borderBottom:`1px solid ${C.bdr}`,borderRadius:0,padding:"3px 0"}}
            onFocus={e=>e.target.style.borderBottomColor=C.acc} onBlur={e=>e.target.style.borderBottomColor=C.bdr}/>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
          {exercise.sets.length>0&&<span style={{fontSize:9,fontWeight:800,borderRadius:20,padding:"2px 8px",background:all?C.grn:C.accF,color:all?"#0a0a0c":C.accD,border:`1px solid ${all?C.grn:C.accD+"44"}`,transition:"all .3s"}}>{done}/{exercise.sets.length}</span>}
          <button onClick={toggleTimer} title={timerOn?"Remove timer":"Add timer"} style={{background:"none",border:`1px solid ${timerOn?C.war+"88":C.bdr}`,borderRadius:6,color:timerOn?C.war:C.dim,padding:"3px 5px",display:"flex",alignItems:"center",transition:"all .15s"}} onMouseEnter={e=>{if(!timerOn){e.currentTarget.style.borderColor=C.war+"88";e.currentTarget.style.color=C.war;}}} onMouseLeave={e=>{if(!timerOn){e.currentTarget.style.borderColor=C.bdr;e.currentTarget.style.color=C.dim;}}}>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          </button>
          <button onClick={onDelete} style={{background:"none",border:"none",color:C.dim,padding:4,display:"flex",transition:"color .15s"}} onMouseEnter={e=>e.currentTarget.style.color=C.red} onMouseLeave={e=>e.currentTarget.style.color=C.dim}>{I.trash}</button>
          {/* Large collapse arrow on the right */}
          <button onClick={()=>setCol(!col)}
            style={{background:"none",border:"none",color:col?C.mut:C.acc,padding:"4px 6px",display:"flex",alignItems:"center",justifyContent:"center",transition:"color .2s, transform .2s",transform:col?"rotate(0deg)":"rotate(180deg)",minWidth:36,minHeight:36}}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
        </div>
      </div>
      {!col&&(
        <>
          <FormCues name={exercise.name}/>
          {timerOn&&<ExTimer duration={exercise.timerDuration} onChangeDuration={v=>onChange({...exercise,timerDuration:v})}/>}
          {prev.length>0&&<div style={{fontSize:9,color:C.dim,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:6,paddingLeft:28}}>↑ prev session</div>}
          {exercise.sets.map((s,i)=><SetRow key={s.id} set={s} idx={i} prevSet={prev[i]||null} isPR={isPR(s)} onChange={u=>updSet(i,u)} onDelete={()=>delSet(i)}/>)}
          <button onClick={addSet} style={{background:C.accF,border:`1px dashed ${C.accD}`,borderRadius:6,color:C.accD,fontSize:11,fontWeight:600,padding:"5px 10px",marginTop:4,display:"flex",alignItems:"center",gap:5}}>{I.plus} Add set</button>
        </>
      )}

  );

              <span>{e.name}</span>

                {e.cues&&<span style={{fontSize:10,color:C.ice,background:`${C.ice}15`,borderRadius:20,padding:"3px 8px"}}>cues</span>}

    <div style={{position:"relative",width:size,height:size}}>

const CommenceWorkout=({workout,onChange,onPRUpdate,prs,onExit,onStopTimer})=>{
  const allEx=[
    ...workout.sections.warmup.map(e=>({...e,sec:"warmup",secLabel:"Warm-Up",secColor:C.war})),
    ...workout.sections.exercises.map(e=>({...e,sec:"exercises",secLabel:"Exercises",secColor:C.acc})),
    ...workout.sections.cooldown.map(e=>({...e,sec:"cooldown",secLabel:"Cool Down",secColor:C.ice})),
  ];
  const [idx,setIdx]=useState(0);
  const [logged,setLogged]=useState(false);
  const [finalTime,setFinalTime]=useState("");
  const [exitPrompt,setExitPrompt]=useState(false);
  const [elapsed,setElapsed]=useState(0);
  const [slideDir,setSDir]=useState(0);
  const startTs=useRef(Date.now());
  useEffect(()=>{const t=setInterval(()=>setElapsed(Math.floor((Date.now()-startTs.current)/1000)),1000);return()=>clearInterval(t);},[]);
  const total=allEx.length;
  const cur=allEx[idx]||allEx[0];
  const isLast=idx===total-1;
  const goTo=(n,dir)=>{if(n<0||n>=total)return;setSDir(dir);setIdx(n);setTimeout(()=>setSDir(0),280);};
  const next=()=>goTo(idx+1,-1);
  const prev=()=>goTo(idx-1,1);
  const exSwipe=useSwipe(()=>{if(!isLast)goTo(idx+1,-1);},()=>{if(idx>0)goTo(idx-1,1);});
  const slideStyle={animation:slideDir!==0?`slide-in-${slideDir<0?"left":"right"} 0.24s cubic-bezier(.25,.46,.45,.94) both`:"none"};
  const updateEx=updated=>{const sec=cur.sec;const exs=workout.sections[sec].map(e=>e.id===cur.id?updated:e);onChange({...workout,sections:{...workout.sections,[sec]:exs}});};
  const finishSession=()=>{
    const duration=fmtSecs(Math.floor((Date.now()-startTs.current)/1000));
    const{prs:newPRs,hits}=detectPRs(workout.sections,prs);
    onPRUpdate(newPRs);
    const snap={};
    for(const[sec,exs]of Object.entries(workout.sections)){snap[sec]=exs.map(ex=>({...ex,prevSets:ex.sets.map(s=>({reps:s.reps,load:s.load})),sets:ex.sets.map(s=>({...s,done:false}))}));}
    onChange({...workout,sections:snap,sessions:[...workout.sessions,{id:uid(),ts:Date.now(),duration}]});
    toast(hits.length>0?"🏆 New PR"+(hits.length>1?"s":"")+"! "+hits.slice(0,2).join(", ")+(hits.length>2?" +"+(hits.length-2)+" more":""):"Session logged ✓");
    setFinalTime(duration);setLogged(true);onStopTimer();
    setTimeout(()=>{setLogged(false);onExit();},3000);
  };
  const liveEx=workout.sections[cur.sec].find(e=>e.id===cur.id)||cur;
  const exPR=prs&&liveEx.name?prs[liveEx.name.trim()]:null;
  const isPR=s=>{if(!exPR)return false;if(!liveEx.prevSets||liveEx.prevSets.length===0)return false;const l=parseFloat(s.load)||0,r=parseInt(s.reps)||0;return(l>0&&l>=exPR.bestLoad)||(r>0&&r>=exPR.bestReps);};
  const doneSets=liveEx.sets.filter(s=>s.done).length;
  const allDone=liveEx.sets.length>0&&doneSets===liveEx.sets.length;
  return(
    <div style={{position:"fixed",inset:0,zIndex:500,background:C.bg,display:"flex",flexDirection:"column",fontFamily:"'DM Mono','Courier New',monospace",overflow:"hidden"}}>
      {/* Completion overlay */}
      {logged&&(
        <div style={{position:"absolute",inset:0,zIndex:200,background:C.bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,textAlign:"center"}}>
          <div style={{width:80,height:80,borderRadius:"50%",background:C.grnF,border:`2px solid ${C.grn}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:40,marginBottom:24}}>✓</div>
          <div style={{fontSize:22,fontWeight:800,color:C.grn,marginBottom:8}}>Session Complete!</div>
          <div style={{fontSize:13,color:C.mut,marginBottom:28}}>{workout.title}</div>
          <div style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:14,padding:"20px 32px",marginBottom:8}}>
            <div style={{fontSize:11,color:C.mut,fontWeight:700,textTransform:"uppercase",letterSpacing:1.5,marginBottom:8}}>Total Time</div>
            <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke={C.acc} strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span style={{fontSize:36,fontWeight:800,color:C.acc,letterSpacing:2,fontVariantNumeric:"tabular-nums"}}>{finalTime}</span>
            </div>
          </div>
          <div style={{fontSize:11,color:C.dim}}>Closing in a moment…</div>
        </div>
      )}
      {/* Exit prompt */}
      {exitPrompt&&(
        <div style={{position:"fixed",inset:0,zIndex:600,background:"rgba(0,0,0,.75)",backdropFilter:"blur(4px)",display:"flex",alignItems:"center",justifyContent:"center",padding:24}} onClick={()=>setExitPrompt(false)}>
          <div onClick={e=>e.stopPropagation()} style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:14,padding:"24px 22px",width:"100%",maxWidth:340,boxShadow:"0 24px 60px rgba(0,0,0,.6)"}}>
            <div style={{width:44,height:44,borderRadius:10,background:`${C.war}18`,border:`1px solid ${C.war}44`,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:16}}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={C.war} strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg></div>
            <div style={{fontSize:16,fontWeight:800,color:C.txt,marginBottom:8}}>End session early?</div>
            <div style={{fontSize:12,color:C.mut,lineHeight:1.7,marginBottom:6}}>You're on exercise <span style={{color:C.txt,fontWeight:700}}>{idx+1} of {total}</span>.</div>
            <div style={{display:"flex",alignItems:"center",gap:6,background:`${C.acc}0d`,border:`1px solid ${C.acc}33`,borderRadius:8,padding:"8px 12px",marginBottom:22}}>
              <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke={C.acc} strokeWidth="2" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span style={{fontSize:11,color:C.acc,fontWeight:700}}>{fmtSecs(elapsed)} elapsed</span>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              <button onClick={()=>{setExitPrompt(false);finishSession();}} style={{background:C.grn,border:"none",borderRadius:10,color:"#0a0a0c",fontSize:13,fontWeight:800,padding:"13px",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:8}} onMouseEnter={e=>e.currentTarget.style.opacity=".85"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>{I.log} Log session anyway</button>
              <button onClick={()=>{setExitPrompt(false);onStopTimer();onExit();}} style={{background:C.sur,border:`1px solid ${C.red}44`,borderRadius:10,color:C.red,fontSize:13,fontWeight:700,padding:"13px",fontFamily:"inherit",transition:"all .15s"}} onMouseEnter={e=>e.currentTarget.style.background=`${C.red}10`} onMouseLeave={e=>e.currentTarget.style.background=C.sur}>Discard &amp; exit</button>
              <button onClick={()=>setExitPrompt(false)} style={{background:"none",border:"none",color:C.mut,fontSize:12,fontWeight:700,padding:"8px",fontFamily:"inherit"}}>← Keep going</button>

            </div>
            <button onClick={onExit} style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:20,color:C.mut,fontSize:11,fontWeight:700,padding:"5px 12px",display:"flex",alignItems:"center",gap:5}}>{I.x} Exit</button>
          </div>
        </div>
        <div style={{height:3,background:C.bdr,borderRadius:2,marginBottom:20}}>
          <div style={{height:"100%",width:`${((idx+1)/total)*100}%`,background:cur.secColor,borderRadius:2,transition:"width .3s ease"}}/>

      {/* Exercise content */}
      <div style={{flex:1,overflowY:"auto",padding:"0 18px"}} {...exSwipe}>
        <div key={idx} style={slideStyle}>
          <h2 style={{fontSize:26,fontWeight:800,color:C.txt,marginBottom:4,lineHeight:1.2}}>{liveEx.name||"Exercise"}</h2>
          {liveEx.sets.length>0&&(
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
              <span style={{fontSize:11,fontWeight:800,borderRadius:20,padding:"3px 10px",background:allDone?C.grn:C.accF,color:allDone?"#0a0a0c":C.accD,border:`1px solid ${allDone?C.grn:C.accD+"44"}`,transition:"all .3s"}}>{doneSets}/{liveEx.sets.length} sets done</span>
              {allDone&&<span style={{fontSize:13}}>✅</span>}
            </div>
          )}
          <FormCues name={liveEx.name}/>
          {liveEx.timerDuration&&<ExTimer duration={liveEx.timerDuration} onChangeDuration={v=>updateEx({...liveEx,timerDuration:v})}/>}
          {(liveEx.prevSets||[]).length>0&&<div style={{fontSize:9,color:C.dim,fontWeight:700,textTransform:"uppercase",letterSpacing:1,marginBottom:6,paddingLeft:28}}>↑ prev session</div>}
          <div style={{marginBottom:12}}>
            {liveEx.sets.map((s,i)=>(
              <SetRow key={s.id} set={s} idx={i} prevSet={(liveEx.prevSets||[])[i]||null} isPR={isPR(s)}
                onChange={u=>updateEx({...liveEx,sets:liveEx.sets.map((ss,j)=>j===i?u:ss)})}
                onDelete={()=>updateEx({...liveEx,sets:liveEx.sets.filter((_,j)=>j!==i)})}/>
            ))}
            <button onClick={()=>{const last=liveEx.sets[liveEx.sets.length-1]||{reps:10,load:0};updateEx({...liveEx,sets:[...liveEx.sets,mkSet(last.reps,last.load)]});}} style={{background:C.accF,border:`1px dashed ${C.accD}`,borderRadius:6,color:C.accD,fontSize:11,fontWeight:600,padding:"6px 12px",marginTop:4,display:"flex",alignItems:"center",gap:5}}>{I.plus} Add set</button>
          </div>
        </div>
      </div>
      {/* Bottom nav */}
      <div style={{padding:"12px 18px",paddingBottom:"max(env(safe-area-inset-bottom,16px) + 12px,24px)",borderTop:`1px solid ${C.bdr}`,background:C.bg}}>
        {!logged&&(
          <>
            <div style={{display:"grid",gridTemplateColumns:idx>0?"1fr 2fr":"1fr",gap:8,marginBottom:8}}>
              {idx>0&&<button onClick={prev} style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:10,color:C.mut,fontSize:13,fontWeight:700,padding:"14px",fontFamily:"inherit"}}>← Back</button>}
              {isLast
                ?<button onClick={finishSession} style={{background:C.grn,border:"none",borderRadius:10,color:"#0a0a0c",fontSize:13,fontWeight:800,padding:"14px",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:8}}>{I.log} Finish &amp; Log</button>
                :<button onClick={next} style={{background:C.acc,border:"none",borderRadius:10,color:"#0a0a0c",fontSize:13,fontWeight:800,padding:"14px",fontFamily:"inherit"}}>Next Exercise →</button>
              }
            </div>
            <button onClick={()=>setExitPrompt(true)} style={{width:"100%",background:"transparent",border:`1px solid ${C.red}33`,borderRadius:10,color:C.red,fontSize:12,fontWeight:700,padding:"10px",fontFamily:"inherit",transition:"all .15s"}} onMouseEnter={e=>{e.currentTarget.style.background=`${C.red}0d`;e.currentTarget.style.borderColor=`${C.red}66`;}} onMouseLeave={e=>{e.currentTarget.style.background="transparent";e.currentTarget.style.borderColor=`${C.red}33`;}}>End Session Early</button>
          </>
        )}
      </div>
    </div>
  );
};

// ── Workout Tab ───────────────────────────────────────────────────────────────

  const [editTitle,setEditTitle]=useState(false);

  const [delModal,setDelModal]=useState(false);
  const [picker,setPicker]=useState(null);
  const [commenced,setCommenced]=useState(false);
  const titleRef=useRef();
  useEffect(()=>{if(editTitle)titleRef.current?.focus();},[editTitle]);
  const startTimer=()=>{if(!timerActive)onStartTimer();};
  const updSec=(sec,exs)=>onChange({...workout,sections:{...workout.sections,[sec]:exs}});
  const addEx=sec=>updSec(sec,[...workout.sections[sec],mkEx()]);
  const addLib=(sec,name)=>updSec(sec,[...workout.sections[sec],mkEx(name)]);
  const delEx=(sec,id)=>updSec(sec,workout.sections[sec].filter(e=>e.id!==id));
  const logSession=()=>{
    startTimer();
    const duration=fmtElapsed(timerActive?timerElapsed:0);
    const{prs:newPRs,hits}=detectPRs(workout.sections,prs);
    onPRUpdate(newPRs);
    const snap={};
    for(const[sec,exs]of Object.entries(workout.sections)){snap[sec]=exs.map(ex=>({...ex,prevSets:ex.sets.map(s=>({reps:s.reps,load:s.load})),sets:ex.sets.map(s=>({...s,done:false}))}));}
    onChange({...workout,sections:snap,sessions:[...workout.sessions,{id:uid(),ts:Date.now(),duration}]});
    setLogged(true);onStopTimer();
    toast(hits.length>0?"🏆 New PR"+(hits.length>1?"s":"")+"! "+hits.slice(0,2).join(", ")+(hits.length>2?" +"+(hits.length-2)+" more":""):"Session logged ✓");
    setTimeout(()=>setLogged(false),2500);
  };
  const delSess=sid=>onChange({...workout,sessions:workout.sessions.filter(s=>s.id!==sid)});
  const totalSets=Object.values(workout.sections).flat().reduce((a,e)=>a+e.sets.length,0);
  const totalEx=Object.values(workout.sections).flat().length;

      {/* Title */}

          ?<input ref={titleRef} value={workout.title} onChange={e=>onChange({...workout,title:e.target.value})} onBlur={()=>setEditTitle(false)} onKeyDown={e=>e.key==="Enter"&&setEditTitle(false)} style={{background:"transparent",border:"none",borderBottom:`2px solid ${C.acc}`,color:C.txt,fontSize:20,fontWeight:800,outline:"none",fontFamily:"inherit",flex:1,paddingBottom:2}}/>
          :<h2 onClick={()=>setEditTitle(true)} style={{margin:0,fontSize:20,fontWeight:800,color:C.txt,cursor:"pointer",flex:1}}>{workout.title}</h2>
        }

        <button onClick={()=>setDelModal(true)} style={{background:"none",border:"none",color:C.dim,padding:6,display:"flex",transition:"color .15s"}} onMouseEnter={e=>e.currentTarget.style.color=C.red} onMouseLeave={e=>e.currentTarget.style.color=C.dim}>{I.trash}</button>
      </div>
      {/* Quick stats */}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:18}}>
        {[{l:"Exercises",v:totalEx,c:C.acc},{l:"Sets",v:totalSets,c:C.war},{l:"Sessions",v:count,c:C.grn}].map(s=>(
          <div key={s.l} style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:8,padding:"10px 12px"}}>

      <Section label="Cool Down" icon={I.snow} color={C.ice} prs={prs} exercises={workout.sections.cooldown} onChange={ex=>updSec("cooldown",ex)} onAdd={()=>addEx("cooldown")} onLib={()=>setPicker("cooldown")} onDel={id=>delEx("cooldown",id)}/>

            <span style={{fontSize:12,color:logged?C.grn:C.acc,fontWeight:700,letterSpacing:1,fontVariantNumeric:"tabular-nums"}}>{logged?"Logged!":fmtElapsed(timerElapsed)}</span>

          <button onClick={()=>{startTimer();setCommenced(true);}} style={{background:C.sur,border:`1px solid ${C.acc}`,borderRadius:10,color:C.acc,fontSize:13,fontWeight:800,padding:"13px",display:"flex",alignItems:"center",justifyContent:"center",gap:7,fontFamily:"inherit",transition:"all .2s"}} onMouseEnter={e=>e.currentTarget.style.background=C.accF} onMouseLeave={e=>e.currentTarget.style.background=C.sur}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>Start
          </button>
          <button onClick={logSession} style={{background:logged?C.grn:C.acc,border:"none",borderRadius:10,color:"#0a0a0c",fontSize:13,fontWeight:800,padding:"13px",display:"flex",alignItems:"center",justifyContent:"center",gap:8,fontFamily:"inherit",transition:"background .3s,box-shadow .3s",boxShadow:logged?`0 0 24px ${C.grn}55`:`0 0 20px ${C.acc}33`}}>{I.log} {logged?"Logged ✓":"Log"}</button>
        </div>
      </div>
    </div>
  );
};

// ── Stats Tab ─────────────────────────────────────────────────────────────────
const getWeekStart=()=>{const n=new Date(),day=n.getDay(),diff=(day===0?-6:1-day),m=new Date(n);m.setHours(0,0,0,0);m.setDate(n.getDate()+diff);return m.getTime();};

const StatsTab=({workouts,prs,weeklyGoal,onSetGoal})=>{
  const [prQ,setPrQ]=useState("");
  const [showAllPRs,setShowAllPRs]=useState(false);
  const weekStart=getWeekStart();
  const allSess=workouts.flatMap(w=>w.sessions.map(s=>({...s,wt:w.title})));
  const weekSess=allSess.filter(s=>s.ts>=weekStart);
  const lastWeekSess=allSess.filter(s=>s.ts>=weekStart-7*86400000&&s.ts<weekStart);
  const wCount=weekSess.length;
  const reached=wCount>=weeklyGoal;
  const recent=[...allSess].sort((a,b)=>b.ts-a.ts).slice(0,6);
  const prList=Object.entries(prs||{}).filter(([n])=>n.toLowerCase().includes(prQ.toLowerCase())).sort((a,b)=>b[1].date-a[1].date);
  const totPRs=Object.keys(prs||{}).length;

  // Progression stats
  const sessThis=wCount,sessLast=lastWeekSess.length,sessDiff=sessThis-sessLast;
  const volThisWeek=weekSess.reduce((a,s)=>{const w=workouts.find(wk=>wk.title===s.wt);if(!w)return a;return a+Object.values(w.sections).flat().flatMap(e=>e.sets).reduce((b,st)=>b+(parseFloat(st.reps)||0)*(parseFloat(st.load)||0),0);},0);
  const volLastWeek=lastWeekSess.reduce((a,s)=>{const w=workouts.find(wk=>wk.title===s.wt);if(!w)return a;return a+Object.values(w.sections).flat().flatMap(e=>e.sets).reduce((b,st)=>b+(parseFloat(st.reps)||0)*(parseFloat(st.load)||0),0);},0);
  const volDiffPct=volLastWeek>0?Math.round(((volThisWeek-volLastWeek)/volLastWeek)*100):null;
  const monthStart=new Date();monthStart.setDate(1);monthStart.setHours(0,0,0,0);
  const recentPR=Object.entries(prs||{}).filter(([,p])=>p.date&&p.date>=monthStart.getTime()).sort((a,b)=>b[1].date-a[1].date)[0];
  const getWeekSess=offset=>{const ws=weekStart-offset*7*86400000;return allSess.filter(s=>s.ts>=ws&&s.ts<ws+7*86400000).length;};
  let streak=0;if(reached){streak=1;let o=1;while(getWeekSess(o)>=weeklyGoal&&o<=52){streak++;o++;}}

  const dayLabels=["M","T","W","T","F","S","S"];
  const dayDots=dayLabels.map((_,i)=>{const d=new Date(weekStart+i*86400000);d.setHours(0,0,0,0);const nx=new Date(d);nx.setDate(d.getDate()+1);return{label:dayLabels[i],hit:weekSess.some(s=>s.ts>=d.getTime()&&s.ts<nx.getTime())};});

  return(
    <div>
      <div style={{marginBottom:22}}>

          )}
          {(prQ?prList:prList.slice(0,showAllPRs?undefined:3)).map(([name,pr])=>(
            <div key={name} style={{background:C.sur,border:"1px solid rgba(255,215,0,.18)",borderRadius:10,padding:"12px 14px",marginBottom:6}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>

                  <div key={s.l} style={{background:C.bg,borderRadius:7,padding:"7px 10px"}}>

            </div>

              {showAllPRs?"Show less ▴":`Show all ${prList.length} PRs ▾`}
            </button>
          )}
        </div>
      )}
    </div>
  );
};

          <SH label="Backup"/>
          <div style={{background:C.bg,borderRadius:10,padding:"0 14px",marginBottom:4}}>
            <div style={{padding:"12px 0",borderBottom:`1px solid ${C.bdr}`}}>
              <div style={{fontSize:9,color:C.mut,fontWeight:800,textTransform:"uppercase",letterSpacing:1,marginBottom:8}}>Reminder Frequency</div>
              <div style={{display:"flex",flexWrap:"wrap",gap:6}}>
                {freqOpts.map(o=><button key={o.v} onClick={()=>onSaveBackupFreq(o.v)} style={{background:backupMeta.frequency===o.v?C.acc:C.sur,border:`1px solid ${backupMeta.frequency===o.v?C.acc:C.bdr}`,borderRadius:8,color:backupMeta.frequency===o.v?"#0a0a0c":C.mut,fontSize:11,fontWeight:700,padding:"5px 10px",transition:"all .15s",fontFamily:"inherit"}}>{o.l}</button>)}
              </div>
            </div>
            <Row label="Backup Now" sub={backupMeta.lastBackup?`Last: ${fmtBD(backupMeta.lastBackup)}`:"Never backed up"} right="↓" onClick={onBackupNow}/>
            <Row label="Restore from Backup" sub="Import a .json backup file" right="↑" onClick={()=>importRef.current?.click()}/>
            <input ref={importRef} type="file" accept=".json" style={{display:"none"}} onChange={e=>{const file=e.target.files[0];if(!file)return;const reader=new FileReader();reader.onload=ev=>{try{onImport(JSON.parse(ev.target.result));onClose();}catch{toast("⚠️ Invalid backup file");}};reader.readAsText(file);e.target.value="";}}/>
          </div>
          <SH label="App"/>
          <div style={{background:C.bg,borderRadius:10,padding:"0 14px",marginBottom:4}}>
            <Row label="Replay Onboarding" sub="Re-run the welcome guide" right="→" onClick={()=>{onResetOnboarding();onClose();}}/>
            <Row label="⭐ Star on GitHub" sub="If FitPR is useful, show some love" right="↗" onClick={()=>window.open("https://github.com/tinq777/fitpr","_blank","noopener")}/>
            <Row label="💬 Submit Feedback" sub="Report a bug or suggest a feature" right="↗" onClick={()=>window.open("https://github.com/tinq777/fitpr/issues/new","_blank","noopener")}/>
            <Row label="🔒 Privacy Policy" sub="How your data is handled" right="↗" onClick={()=>window.open("https://github.com/tinq777/fitpr/blob/main/PRIVACY.md","_blank","noopener")}/>
            <Row label="Version" sub="FitPR v1.0 · github.com/tinq777/fitpr"/>
          </div>
        </div>
        {confirm&&(
          <div style={{position:"fixed",inset:0,zIndex:1200,background:"rgba(0,0,0,.7)",display:"flex",alignItems:"center",justifyContent:"center",padding:24}} onClick={()=>setConfirm(null)}>
            <div onClick={e=>e.stopPropagation()} style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:14,padding:"24px 22px",width:"100%",maxWidth:340}}>
              <div style={{fontSize:16,fontWeight:800,color:C.txt,marginBottom:8}}>{confirm==="allSessions"?"Clear all sessions?":confirm==="prs"?"Clear all PRs?":`Clear sessions for "${confirm.title}"?`}</div>
              <div style={{fontSize:12,color:C.mut,marginBottom:22,lineHeight:1.6}}>{confirm==="allSessions"?`All ${totalSessions} sessions will be permanently deleted.`:confirm==="prs"?`All ${totPRs} personal records will be permanently deleted.`:"All sessions for this workout will be deleted."}</div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                <button onClick={()=>setConfirm(null)} style={{background:C.surH,border:`1px solid ${C.bdr}`,borderRadius:8,color:C.mut,fontSize:12,fontWeight:700,padding:"10px",fontFamily:"inherit"}}>Cancel</button>
                <button onClick={()=>{if(confirm==="allSessions")onClearAllSessions();else if(confirm==="prs")onClearPRs();else onClearSessions(confirm.workoutId);setConfirm(null);}} style={{background:C.red,border:"none",borderRadius:8,color:"#fff",fontSize:12,fontWeight:800,padding:"10px",fontFamily:"inherit"}}>Delete</button>
              </div>
            </div>
          </div>
        )}
      </div>
    </div>
  );
};

// ── Onboarding ────────────────────────────────────────────────────────────────
const Onboarding=({onDone})=>{
  const [idx,setIdx]=useState(0);
  const [exiting,setExiting]=useState(false);
  const [slideDir,setSDir]=useState(0);
  const slide=SLIDES[idx];
  const isLast=idx===SLIDES.length-1;
  const accentColor=slide.accent();
  const finish=()=>{setExiting(true);setTimeout(onDone,350);};
  const goTo=(n,dir)=>{if(n<0||n>=SLIDES.length)return;setSDir(dir);setIdx(n);setTimeout(()=>setSDir(0),280);};
  const next=()=>{if(isLast){finish();return;}goTo(idx+1,-1);};
  const swipe=useSwipe(()=>{if(!isLast)goTo(idx+1,-1);else finish();},()=>{if(idx>0)goTo(idx-1,1);});
  const slideStyle={animation:slideDir!==0?`slide-in-${slideDir<0?"left":"right"} 0.26s cubic-bezier(.25,.46,.45,.94) both`:"none"};
  return(
    <div style={{position:"fixed",inset:0,zIndex:9000,background:C.bg,display:"flex",flexDirection:"column",fontFamily:"'DM Mono','Courier New',monospace",opacity:exiting?0:1,transition:"opacity .35s"}} {...swipe}>
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",paddingTop:"max(env(safe-area-inset-top,20px) + 8px,24px)",paddingLeft:"20px",paddingRight:"20px",paddingBottom:0,flexShrink:0}}>
        {idx>0?<button onClick={()=>goTo(idx-1,1)} style={{background:"none",border:"none",color:C.mut,fontSize:13,fontWeight:700,padding:"8px 4px",display:"flex",alignItems:"center",gap:4}}>← Back</button>:<div style={{width:60}}/>}
        <button onClick={finish} style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:20,color:C.mut,fontSize:12,fontWeight:700,padding:"6px 14px",transition:"all .15s"}} onMouseEnter={e=>{e.currentTarget.style.borderColor=C.acc;e.currentTarget.style.color=C.acc;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bdr;e.currentTarget.style.color=C.mut;}}>Skip onboarding</button>
      </div>
      <div key={idx} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-start",padding:"28px 28px 8px",textAlign:"center",overflowY:"auto",...slideStyle}}>
        <div style={{width:96,height:96,borderRadius:"50%",background:`${accentColor}18`,border:`2px solid ${accentColor}44`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:44,marginBottom:24,flexShrink:0}}>{slide.emoji}</div>
        <div style={{fontSize:11,color:accentColor,fontWeight:800,textTransform:"uppercase",letterSpacing:2,marginBottom:8}}>{slide.subtitle}</div>
        <h1 style={{fontSize:24,fontWeight:800,color:C.txt,margin:"0 0 14px",lineHeight:1.2}}>{slide.title}</h1>
        <p style={{fontSize:13,color:C.mut,lineHeight:1.7,maxWidth:320,margin:"0 0 24px"}}>{slide.body}</p>
        {slide.features&&(
          <div style={{display:"flex",flexDirection:"column",gap:8,width:"100%",maxWidth:320,marginBottom:8}}>
            {slide.features.map((f,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:10,background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:10,padding:"10px 14px",textAlign:"left"}}>
                <div style={{width:6,height:6,borderRadius:"50%",background:accentColor,flexShrink:0}}/>
                <span style={{fontSize:12,color:C.txt,fontWeight:600}}>{f}</span>
              </div>
            ))}
          </div>
        )}
        {slide.install&&(
          <div style={{display:"flex",flexDirection:"column",gap:8,width:"100%",maxWidth:320}}>
            {[{icon:"📱",label:"iOS — Safari",steps:['Open in Safari','Tap the Share button ↑','Tap "Add to Home Screen"','Tap Add'],color:C.ice},{icon:"🤖",label:"Android — Chrome",steps:['Open in Chrome','Tap the ⋮ menu','Tap "Add to Home Screen"','Tap Install'],color:C.grn},{icon:"💻",label:"Desktop — Chrome / Edge",steps:['Open in Chrome or Edge','Click the install icon in the address bar','Click Install'],color:C.acc}].map(p=>(
              <div key={p.label} style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:12,padding:"12px 14px",textAlign:"left"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}><span style={{fontSize:16}}>{p.icon}</span><span style={{fontSize:12,fontWeight:800,color:p.color}}>{p.label}</span></div>
                {p.steps.map((s,i)=>(
                  <div key={i} style={{display:"flex",alignItems:"flex-start",gap:8,marginBottom:i<p.steps.length-1?5:0}}>
                    <span style={{fontSize:10,fontWeight:800,color:p.color,flexShrink:0,minWidth:16,marginTop:1}}>{i+1}.</span>
                    <span style={{fontSize:11,color:C.mut,lineHeight:1.5}}>{s}</span>
                  </div>
                ))}
              </div>
            ))}
          </div>
        )}
      </div>
      <div style={{padding:"12px 28px 48px",display:"flex",flexDirection:"column",alignItems:"center",gap:16,flexShrink:0}}>
        <div style={{display:"flex",gap:6}}>
          {SLIDES.map((_,i)=><button key={i} onClick={()=>goTo(i,i>idx?-1:1)} style={{width:i===idx?20:6,height:6,borderRadius:3,background:i===idx?accentColor:C.bdr,border:"none",padding:0,transition:"all .3s",cursor:"pointer"}}/>)}
        </div>
        <button onClick={next} style={{width:"100%",maxWidth:320,background:accentColor,border:"none",borderRadius:14,color:"#0a0a0c",fontSize:15,fontWeight:800,padding:"16px",fontFamily:"inherit",letterSpacing:.5,boxShadow:`0 0 30px ${accentColor}44`,transition:"all .3s"}}>
          {slide.cta||(isLast?"Start Training →":"Next →")}
        </button>
        <span style={{fontSize:11,color:C.dim}}>{idx+1} of {SLIDES.length}</span>
      </div>
    </div>
  );
};

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const init=initState();
  const [workouts,setWorkouts]=useState(init.workouts);
  const [tab,setTab]=useState(init.tab||"stats");
  const [prs,setPrs]=useState(init.prs||{});
  const [weeklyGoal,setWeeklyGoal]=useState(init.weeklyGoal||4);
  const [onboarded,setOnboarded]=useState(init.onboarded!==false);
  const [slideDir,setSlideDir]=useState(0);
  const [backupMeta,setBackupMeta]=useState(loadBM);
  const [backupReminder,setBackupReminder]=useState(false);
  const [backupPanel,setBackupPanel]=useState(false);
  const [settingsOpen,setSettingsOpen]=useState(false);
  // Global session timer
  const [timerActive,setTimerActive]=useState(false);
  const [timerElapsed,setTimerElapsed]=useState(0);
  const timerStartTs=useRef(null);
  useEffect(()=>{if(!timerActive)return;const t=setInterval(()=>setTimerElapsed(Math.floor((Date.now()-timerStartTs.current)/1000)),1000);return()=>clearInterval(t);},[timerActive]);
  const startTimer=()=>{if(!timerActive){timerStartTs.current=Date.now();setTimerActive(true);setTimerElapsed(0);}};
  const stopTimer=()=>{setTimerActive(false);setTimerElapsed(0);timerStartTs.current=null;};

  useEffect(()=>{save({workouts,tab,prs,weeklyGoal,onboarded});},[workouts,tab,prs,weeklyGoal,onboarded]);

  useEffect(()=>{
    const check=()=>{const{lastBackup,frequency}=backupMeta;if(frequency===0)return;if(!lastBackup){setBackupReminder(true);return;}const days=(Date.now()-lastBackup)/(1000*60*60*24);setBackupReminder(days>=frequency);};
    check();const t=setInterval(check,60*60*1000);return()=>clearInterval(t);
  },[backupMeta]);

  const doBackup=()=>{triggerDL({workouts,prs,exportedAt:new Date().toISOString()});const u={...backupMeta,lastBackup:Date.now()};setBackupMeta(u);saveBM(u);setBackupReminder(false);toast("💾 Backup saved to your device");};
  const saveBackupFreq=freq=>{const u={...backupMeta,frequency:freq};setBackupMeta(u);saveBM(u);};
  const clearSessions=id=>{setWorkouts(p=>p.map(w=>w.id===id?{...w,sessions:[]}:w));toast("Sessions cleared");};
  const clearAllSessions=()=>{setWorkouts(p=>p.map(w=>({...w,sessions:[]})));toast("All sessions cleared");};
  const clearPRs=()=>{setPrs({});toast("PR history cleared");};
  const importBackup=data=>{if(data.workouts)setWorkouts(data.workouts);if(data.prs)setPrs(data.prs);if(data.weeklyGoal)setWeeklyGoal(data.weeklyGoal);toast("✅ Backup restored");};

  const tabIds=["stats",...workouts.map(w=>w.id)];
  const goToTab=(newTab,dir)=>{setSlideDir(dir);setTab(newTab);setTimeout(()=>setSlideDir(0),320);};
  const swipeLeft=()=>{const i=tabIds.indexOf(tab);if(i<tabIds.length-1)goToTab(tabIds[i+1],-1);};
  const swipeRight=()=>{const i=tabIds.indexOf(tab);if(i>0)goToTab(tabIds[i-1],1);};
  const swipe=useSwipe(swipeLeft,swipeRight);

  const addW=()=>{const w=mkWork(workouts.length+1);setWorkouts(p=>[...p,w]);goToTab(w.id,-1);};
  const updW=(id,u)=>setWorkouts(p=>p.map(w=>w.id===id?u:w));
  const delW=id=>{setWorkouts(p=>p.filter(w=>w.id!==id));goToTab("stats",1);};
  const dupW=id=>{
    const src=workouts.find(w=>w.id===id);if(!src)return;
    const cp=exs=>exs.map(ex=>({...ex,id:uid(),sessions:[],sets:ex.sets.map(s=>({...s,id:uid(),done:false})),prevSets:[]}));
    const w={...src,id:uid(),title:`${src.title} (copy)`,sessions:[],sections:{warmup:cp(src.sections.warmup),exercises:cp(src.sections.exercises),cooldown:cp(src.sections.cooldown)}};
    setWorkouts(p=>[...p,w]);goToTab(w.id,-1);toast(`Duplicated "${src.title}"`);
  };
  const active=workouts.find(w=>w.id===tab);
  const totSess=workouts.reduce((a,w)=>a+w.sessions.length,0);
  const slideStyle={animation:slideDir!==0?`slide-in-${slideDir<0?"left":"right"} 0.28s cubic-bezier(.25,.46,.45,.94) both`:"none"};
  const bkSt=bkpStatus(backupMeta.lastBackup);

  return(
    <div style={{background:C.bg,minHeight:"100vh",fontFamily:"'DM Mono','Courier New',monospace",color:C.txt}}>
      <style>{`
        @keyframes slide-in-left{from{opacity:.4;transform:translateX(48px)}to{opacity:1;transform:translateX(0)}}
        @keyframes slide-in-right{from{opacity:.4;transform:translateX(-48px)}to{opacity:1;transform:translateX(0)}}
        @keyframes slide-up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      `}</style>
      {!onboarded&&<Onboarding onDone={()=>setOnboarded(true)}/>}
      {settingsOpen&&<SettingsPanel workouts={workouts} prs={prs} weeklyGoal={weeklyGoal} backupMeta={backupMeta} onSetGoal={setWeeklyGoal} onClearSessions={clearSessions} onClearAllSessions={clearAllSessions} onClearPRs={clearPRs} onBackupNow={()=>{doBackup();}} onSaveBackupFreq={saveBackupFreq} onImport={importBackup} onResetOnboarding={()=>setOnboarded(false)} onClose={()=>setSettingsOpen(false)}/>}
      {backupPanel&&<BackupPanel meta={backupMeta} onBackupNow={()=>{doBackup();setBackupPanel(false);}} onSaveFreq={saveBackupFreq} onClose={()=>setBackupPanel(false)}/>}
      {backupReminder&&(
        <div style={{position:"fixed",bottom:0,left:0,right:0,zIndex:1500,background:"#18181d",borderTop:`1px solid ${C.war}55`,padding:"12px 18px 28px",display:"flex",alignItems:"center",gap:12,animation:"slide-up .3s ease both"}}>
          <span style={{fontSize:20,flexShrink:0}}>💾</span>
          <div style={{flex:1}}><div style={{fontSize:12,fontWeight:800,color:C.txt}}>Backup reminder</div><div style={{fontSize:10,color:C.mut,marginTop:2}}>{backupMeta.lastBackup?`Last backup was ${Math.floor((Date.now()-backupMeta.lastBackup)/(1000*60*60*24))} days ago`:"You haven't backed up yet"}</div></div>
          <button onClick={()=>setBackupReminder(false)} style={{background:"none",border:"none",color:C.mut,padding:6,display:"flex",flexShrink:0}}>{I.x}</button>
          <button onClick={doBackup} style={{background:C.acc,border:"none",borderRadius:8,color:"#0a0a0c",fontSize:12,fontWeight:800,padding:"8px 14px",flexShrink:0,fontFamily:"inherit"}}>Backup Now</button>
        </div>
      )}
      <div style={{paddingTop:"max(env(safe-area-inset-top,20px) + 14px,32px)",paddingLeft:"18px",paddingRight:"18px",paddingBottom:0,maxWidth:480,margin:"0 auto"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:18}}>
          <div style={{width:30,height:30,background:C.acc,borderRadius:7,display:"flex",alignItems:"center",justifyContent:"center"}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M6 5v14M18 5v14M2 8h4M18 8h4M2 16h4M18 16h4M6 12h12" stroke="#0a0a0c" strokeWidth="2.5" strokeLinecap="round"/></svg>
          </div>
          <div><div style={{fontSize:13,fontWeight:800,letterSpacing:1.5,color:C.txt}}>FitPR</div><div style={{fontSize:8,color:C.mut,letterSpacing:2,textTransform:"uppercase"}}>Fitness Tracker</div></div>
          <div style={{flex:1}}/>
          {timerActive&&(
            <div style={{display:"flex",alignItems:"center",gap:5,background:`${C.acc}15`,border:`1px solid ${C.acc}55`,borderRadius:20,padding:"3px 10px"}}>
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke={C.acc} strokeWidth="2.5" strokeLinecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span style={{fontSize:11,fontWeight:800,color:C.acc,letterSpacing:.5,fontVariantNumeric:"tabular-nums"}}>{fmtSecs(timerElapsed)}</span>
            </div>
          )}
          <button onClick={()=>setSettingsOpen(true)} title="Settings" style={{background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:8,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:C.mut,transition:"all .15s",flexShrink:0}} onMouseEnter={e=>{e.currentTarget.style.borderColor=C.acc;e.currentTarget.style.color=C.acc;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bdr;e.currentTarget.style.color=C.mut;}}>{I.gear}</button>
          <button onClick={()=>setBackupPanel(true)} title="Backup" style={{position:"relative",background:C.sur,border:`1px solid ${C.bdr}`,borderRadius:8,width:34,height:34,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:C.mut,transition:"all .15s",flexShrink:0}} onMouseEnter={e=>{e.currentTarget.style.borderColor=bkSt.color;e.currentTarget.style.color=bkSt.color;}} onMouseLeave={e=>{e.currentTarget.style.borderColor=C.bdr;e.currentTarget.style.color=C.mut;}}>
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <div style={{position:"absolute",top:5,right:5,width:6,height:6,borderRadius:"50%",background:bkSt.color,boxShadow:`0 0 5px ${bkSt.color}99`}}/>
          </button>
          {totSess>0&&<div style={{background:C.grnF,border:`1px solid ${C.grn}44`,color:C.grn,fontSize:10,fontWeight:800,borderRadius:20,padding:"3px 10px"}}>{totSess} sessions</div>}
        </div>
        <div className="tabs">
          <button onClick={()=>goToTab("stats",tabIds.indexOf("stats")<tabIds.indexOf(tab)?1:-1)} style={{background:tab==="stats"?C.acc:C.sur,color:tab==="stats"?"#0a0a0c":C.mut,border:`1px solid ${tab==="stats"?C.acc:C.bdr}`,borderBottom:"none",borderRadius:"8px 8px 0 0",padding:"7px 13px",fontSize:10,fontWeight:800,display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap",flexShrink:0,transition:"all .15s",letterSpacing:.5}}>{I.stats} STATS</button>
          {workouts.map(w=>{const on=tab===w.id,sc=w.sessions.length,wIdx=tabIds.indexOf(w.id),curIdx=tabIds.indexOf(tab);return(
            <button key={w.id} onClick={()=>goToTab(w.id,wIdx<curIdx?1:-1)} style={{background:on?C.sur:"transparent",color:on?C.txt:C.mut,border:`1px solid ${on?C.bdr:"transparent"}`,borderBottom:on?`1px solid ${C.sur}`:"none",borderRadius:"8px 8px 0 0",padding:"7px 11px",fontSize:10,fontWeight:700,whiteSpace:"nowrap",flexShrink:0,transition:"all .15s",display:"flex",alignItems:"center",gap:6,maxWidth:130,overflow:"hidden"}}>
              <span style={{overflow:"hidden",textOverflow:"ellipsis"}}>{w.title}</span>
              {sc>0&&<span style={{background:C.grn,color:"#0a0a0c",fontSize:9,fontWeight:800,borderRadius:20,padding:"1px 6px",flexShrink:0}}>×{sc}</span>}
            </button>
          );})}
          <button onClick={addW} style={{background:"transparent",color:C.mut,border:`1px dashed ${C.bdr}`,borderBottom:"none",borderRadius:"8px 8px 0 0",padding:"7px 11px",display:"flex",alignItems:"center",flexShrink:0,transition:"all .15s"}} onMouseEnter={e=>{e.currentTarget.style.color=C.acc;e.currentTarget.style.borderColor=C.accD;}} onMouseLeave={e=>{e.currentTarget.style.color=C.mut;e.currentTarget.style.borderColor=C.bdr;}}>{I.plus}</button>
        </div>
      </div>
      <div style={{borderTop:`1px solid ${C.bdr}`}} {...swipe}>
        <div key={tab} style={{maxWidth:480,margin:"0 auto",padding:"22px 18px 100px",...slideStyle}}>
          {tab==="stats"&&<StatsTab workouts={workouts} prs={prs} weeklyGoal={weeklyGoal} onSetGoal={setWeeklyGoal}/>}
          {active&&<WorkoutTab workout={active} onChange={u=>updW(active.id,u)} onDelete={()=>delW(active.id)} onDuplicate={()=>dupW(active.id)} prs={prs} onPRUpdate={setPrs} timerElapsed={timerElapsed} timerActive={timerActive} onStartTimer={startTimer} onStopTimer={stopTimer} fmtElapsed={fmtSecs}/>}
        </div>
      </div>
      {tabIds.length>1&&(
        <div style={{position:"fixed",bottom:backupReminder?80:16,left:"50%",transform:"translateX(-50%)",display:"flex",gap:5,zIndex:100,pointerEvents:"none",transition:"bottom .3s"}}>
          {tabIds.map(id=><div key={id} style={{width:id===tab?16:5,height:5,borderRadius:3,background:id===tab?C.acc:C.bdr,transition:"all .3s",opacity:.8}}/>)}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if("serviceWorker" in navigator){
  const sw=`const C="fitpr-v2";self.addEventListener("install",e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(["/"])).then(()=>self.skipWaiting()))});self.addEventListener("activate",e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});self.addEventListener("fetch",e=>{if(e.request.method!=="GET")return;e.respondWith(caches.match(e.request).then(ca=>{const net=fetch(e.request).then(r=>{if(r.ok){const cl=r.clone();caches.open(C).then(c=>c.put(e.request,cl))}return r}).catch(()=>ca);return ca||net}))});`;
  const blob=new Blob([sw],{type:"application/javascript"});
  navigator.serviceWorker.register(URL.createObjectURL(blob),{scope:"/"}).catch(()=>{});
}
let dp=null;
const banner=document.getElementById("install-banner");
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();dp=e;banner.classList.add("show");});
document.getElementById("btn-install").addEventListener("click",async()=>{if(!dp)return;dp.prompt();const{outcome}=await dp.userChoice;if(outcome==="accepted")banner.classList.remove("show");dp=null;});
document.getElementById("btn-dismiss").addEventListener("click",()=>banner.classList.remove("show"));
window.addEventListener("appinstalled",()=>{banner.classList.remove("show");dp=null;});
</script>
